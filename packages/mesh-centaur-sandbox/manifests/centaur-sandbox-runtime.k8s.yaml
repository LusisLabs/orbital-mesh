# State slice: mesh.centaur_deployment_profile.v1
# Provenance: Mesh-owned Kubernetes deployment profile adapted from Centaur
# sandbox deployment patterns recorded in docs/centaur-source-input.md. This is
# not a copied Centaur Helm chart and is disabled by default.
apiVersion: v1
kind: Namespace
metadata:
  name: mesh-centaur-sandboxes
  labels:
    app.kubernetes.io/part-of: mesh
    mesh.lusis.io/state-slice: mesh.centaur_deployment_profile.v1
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mesh-centaur-sandbox-runner
  namespace: mesh-centaur-sandboxes
  labels:
    app.kubernetes.io/part-of: mesh
    mesh.lusis.io/state-slice: mesh.centaur_deployment_profile.v1
automountServiceAccountToken: false
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: mesh-centaur-sandboxes
  labels:
    app.kubernetes.io/part-of: mesh
    mesh.lusis.io/state-slice: mesh.centaur_deployment_profile.v1
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: mesh-centaur-sandboxes
  labels:
    app.kubernetes.io/part-of: mesh
    mesh.lusis.io/state-slice: mesh.centaur_deployment_profile.v1
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-adapter-to-credential-proxy
  namespace: mesh-centaur-sandboxes
  labels:
    app.kubernetes.io/part-of: mesh
    mesh.lusis.io/state-slice: mesh.centaur_deployment_profile.v1
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mesh-centaur-sandbox-adapter
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mesh-centaur-credential-egress-proxy
      ports:
        - protocol: TCP
          port: 15001
---
apiVersion: v1
kind: Service
metadata:
  name: mesh-centaur-credential-egress-proxy
  namespace: mesh-centaur-sandboxes
  labels:
    app.kubernetes.io/part-of: mesh
    app.kubernetes.io/name: mesh-centaur-credential-egress-proxy
    mesh.lusis.io/state-slice: mesh.centaur_deployment_profile.v1
spec:
  selector:
    app.kubernetes.io/name: mesh-centaur-credential-egress-proxy
  ports:
    - name: http
      port: 15001
      targetPort: 15001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mesh-centaur-credential-egress-proxy
  namespace: mesh-centaur-sandboxes
  labels:
    app.kubernetes.io/part-of: mesh
    app.kubernetes.io/name: mesh-centaur-credential-egress-proxy
    mesh.lusis.io/state-slice: mesh.centaur_deployment_profile.v1
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: mesh-centaur-credential-egress-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mesh-centaur-credential-egress-proxy
        app.kubernetes.io/part-of: mesh
        mesh.lusis.io/state-slice: mesh.centaur_deployment_profile.v1
      annotations:
        mesh.lusis.io/live-execution: blocked-until-credential-egress-proof
        mesh.lusis.io/credential-egress-boundary: host-bound-substitution
    spec:
      serviceAccountName: mesh-centaur-sandbox-runner
      automountServiceAccountToken: false
      containers:
        - name: credential-egress-proxy
          image: ghcr.io/lusislabs/mesh-credential-egress-proxy:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 15001
          env:
            - name: MESH_CREDENTIAL_PLACEHOLDER_MODE
              value: "true"
            - name: MESH_CREDENTIAL_POLICY_REF
              value: mesh.credential_egress_policy.v1
            - name: MESH_CREDENTIAL_ALLOWED_HOSTS
              value: ""
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mesh-centaur-sandbox-adapter
  namespace: mesh-centaur-sandboxes
  labels:
    app.kubernetes.io/part-of: mesh
    app.kubernetes.io/name: mesh-centaur-sandbox-adapter
    mesh.lusis.io/state-slice: mesh.centaur_deployment_profile.v1
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: mesh-centaur-sandbox-adapter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mesh-centaur-sandbox-adapter
        app.kubernetes.io/part-of: mesh
        mesh.lusis.io/state-slice: mesh.centaur_deployment_profile.v1
        mesh.lusis.io/sandbox-runtime: centaur-source-input
        mesh.lusis.io/run-id: placeholder
        mesh.lusis.io/task-id: placeholder
        mesh.lusis.io/attempt-id: placeholder
        mesh.lusis.io/agent: placeholder
      annotations:
        mesh.lusis.io/live-execution: blocked-until-credential-egress-proof
        mesh.lusis.io/credential-egress-proxy: mesh-centaur-credential-egress-proxy
        mesh.lusis.io/warm-pool: optional
        mesh.lusis.io/cleanup-policy: release-thread-and-delete-sandbox
    spec:
      serviceAccountName: mesh-centaur-sandbox-runner
      automountServiceAccountToken: false
      containers:
        - name: adapter
          image: ghcr.io/lusislabs/mesh-centaur-sandbox-adapter:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: health
              containerPort: 8080
          env:
            - name: MESH_AGENT_FABRIC_MODE
              value: centaur
            - name: MESH_CENTAUR_CREDENTIAL_EGRESS_POLICY_REQUIRED
              value: "true"
            - name: MESH_CREDENTIAL_EGRESS_PROXY_URL
              value: http://mesh-centaur-credential-egress-proxy:15001
          readinessProbe:
            httpGet:
              path: /health/ready
              port: health
            periodSeconds: 10
            failureThreshold: 3
