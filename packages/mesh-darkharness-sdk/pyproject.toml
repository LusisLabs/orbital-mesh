[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mesh-darkharness-sdk"
version = "0.1.0"
description = "Perennial Darkharness packet schemas, signing, and policy verification"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["cryptography>=42.0.0"]
license = { text = "MIT" }
authors = [{ name = "Mesh Intelligence Contributors" }]
keywords = ["darkharness", "governance", "audit", "perennial", "mesh"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
[project.urls]
Homepage = "https://github.com/LusisLabs/mesh-darkharness-sdk"
Repository = "https://github.com/LusisLabs/mesh-darkharness-sdk"
Documentation = "https://github.com/LusisLabs/mesh-darkharness-sdk#readme"

[project.scripts]
mesh-darkharness = "mesh_darkharness.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mesh_darkharness = ["schemas/**/*.json"]
