[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mesh-praxis"
version = "0.1.0"
description = "Praxis source-to-MCP certification pipeline with bounded dry-run runtime"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
license = { text = "MIT" }
authors = [{ name = "Mesh Intelligence Contributors" }]
keywords = ["praxis", "mcp", "connector-certification", "mesh"]
[project.urls]
Homepage = "https://github.com/LusisLabs/mesh-praxis"
Repository = "https://github.com/LusisLabs/mesh-praxis"

[project.scripts]
mesh-praxis = "mesh_praxis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mesh_praxis = ["schemas/**/*.json"]
