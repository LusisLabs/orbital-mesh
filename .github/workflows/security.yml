name: Security Audit

on:
  pull_request:
  push:
    branches: [main, master]
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_LINUX_X64_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - name: Verify audit controls
        run: python scripts/verify_security_audit_readiness.py --json

  dependency-review:
    if: github.event_name == 'pull_request' && (github.event.repository.private == false || vars.GHAS_DEPENDENCY_REVIEW_ON_PRIVATE == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48
        with:
          fail-on-severity: high

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - name: Install Gitleaks CLI
        run: |
          curl -fsSLo /tmp/gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_LINUX_X64_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Run secret scan
        run: gitleaks detect --source=. --no-git --redact --verbose

  lockfile-vulnerability-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - run: mkdir -p dist/security
      - name: Run OSV lockfile scan
        run: |
          docker run --rm -v "${PWD}:/src" ghcr.io/google/osv-scanner@sha256:2e07e642463100474fc5e214b66e6beccbd6bfa63dd3fbf047b3f755e78a6cfe \
            scan \
            --format json \
            --output-file /src/dist/security/osv-lockfile-scan.json \
            --lockfile=/src/uv.lock \
            --lockfile=/src/pnpm-lock.yaml \
            --lockfile=/src/latent-mesh/LatentMAS/Cargo.lock
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: osv-lockfile-scan
          path: dist/security/osv-lockfile-scan.json
          retention-days: 30

  pnpm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Enable pnpm for setup-node cache
        run: corepack enable
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Enable pnpm for Node 22
        run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: mkdir -p dist/security
      - run: pnpm --dir web audit --audit-level high --json > dist/security/pnpm-audit-web.json
      - run: pnpm --dir meshapp/frontend audit --audit-level high --json > dist/security/pnpm-audit-meshapp.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: pnpm-audit
          path: dist/security/pnpm-audit*.json
          retention-days: 30

  codeql:
    if: github.event.repository.private == false || vars.CODEQL_ON_PRIVATE == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: github/codeql-action/init@ed410739ba306e4ebe5e123421a6bd694e494a2b
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@ed410739ba306e4ebe5e123421a6bd694e494a2b

  openssf-scorecard:
    if: github.event.repository.private == false || vars.OPENSSF_SCORECARD_ON_PRIVATE == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: read
      contents: read
      issues: read
      pull-requests: read
      security-events: write
      statuses: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: false
      - uses: github/codeql-action/upload-sarif@ed410739ba306e4ebe5e123421a6bd694e494a2b
        with:
          sarif_file: scorecard-results.sarif
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: openssf-scorecard-sarif
          path: scorecard-results.sarif
          retention-days: 30
