name: Security Audit

on:
  pull_request:
  push:
    branches: [main, master]
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_LINUX_X64_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Verify audit controls
        run: python scripts/verify_security_audit_readiness.py --json

  dependency-review:
    if: github.event_name == 'pull_request' && (github.event.repository.private == false || vars.GHAS_DEPENDENCY_REVIEW_ON_PRIVATE == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/dependency-review-action@595b5aeba73380359d98a5e087f648dbb0edce1b
        with:
          fail-on-severity: high

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - name: Install Gitleaks CLI
        run: |
          curl -fsSLo /tmp/gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_LINUX_X64_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Run secret scan
        run: gitleaks detect --source=. --no-git --redact --verbose

  lockfile-vulnerability-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - run: mkdir -p dist/security
      - name: Run OSV lockfile scan
        run: |
          docker run --rm -v "${PWD}:/src" ghcr.io/google/osv-scanner@sha256:2e07e642463100474fc5e214b66e6beccbd6bfa63dd3fbf047b3f755e78a6cfe \
            scan \
            --format json \
            --output-file /src/dist/security/osv-lockfile-scan.json \
            --lockfile=/src/uv.lock \
            --lockfile=/src/web/package-lock.json \
            --lockfile=/src/latent-mesh/LatentMAS/Cargo.lock
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: osv-lockfile-scan
          path: dist/security/osv-lockfile-scan.json
          retention-days: 30

  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: mkdir -p ../dist/security
        working-directory: web
      - run: npm audit --audit-level=high --json > ../dist/security/npm-audit.json
        working-directory: web
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: npm-audit
          path: dist/security/npm-audit.json
          retention-days: 30

  codeql:
    if: github.event.repository.private == false || vars.CODEQL_ON_PRIVATE == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: github/codeql-action/init@ed410739ba306e4ebe5e123421a6bd694e494a2b
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@ed410739ba306e4ebe5e123421a6bd694e494a2b

  openssf-scorecard:
    if: github.event.repository.private == false || vars.OPENSSF_SCORECARD_ON_PRIVATE == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: false
      - uses: github/codeql-action/upload-sarif@ed410739ba306e4ebe5e123421a6bd694e494a2b
        with:
          sarif_file: scorecard-results.sarif
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: openssf-scorecard-sarif
          path: scorecard-results.sarif
          retention-days: 30
