name: Repo patch service image release

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: repo-patch-service-image-release-${{ github.sha }}
  cancel-in-progress: false

env:
  SYFT_VERSION: "1.44.0"
  SYFT_DEB_SHA256: 82d374ac6179acda9d0b6b3e694ecfda54dfbd9da8e29e02dc81f92d67dc103b
  GRYPE_VERSION: "0.112.0"
  GRYPE_DEB_SHA256: 434bae8af635b6308d7a33ea842c6216dc382d4ec49fe3873f927b7805cc69e2
  RELEASE_ROOT: dist/repo-patch-service-release
  REPO_PATCH_GITHUB_ATTESTATIONS_ENABLED: ${{ vars.REPO_PATCH_GITHUB_ATTESTATIONS_ENABLED }}
  REPO_PATCH_ACTIONS_ARTIFACT_STORAGE_READY: ${{ vars.REPO_PATCH_ACTIONS_ARTIFACT_STORAGE_READY }}
  REPO_PATCH_VERIFIER_SANDBOX_PROFILE_DIGEST: ${{ vars.REPO_PATCH_VERIFIER_SANDBOX_PROFILE_DIGEST }}
  REPO_PATCH_VERIFIER_KEY_ID: ${{ vars.REPO_PATCH_VERIFIER_KEY_ID }}
  REPO_PATCH_VERIFIER_PUBLIC_KEY_PEM: ${{ vars.REPO_PATCH_VERIFIER_PUBLIC_KEY_PEM }}

jobs:
  build-scan-publish:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out exact release commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify exact clean source state
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"

      - name: Verify release platform preconditions before build
        shell: bash
        run: |
          set -euo pipefail
          test "$REPO_PATCH_GITHUB_ATTESTATIONS_ENABLED" = "true"
          test "$REPO_PATCH_ACTIONS_ARTIFACT_STORAGE_READY" = "true"

      - name: Install locked workspace
        run: pnpm install --frozen-lockfile

      - name: Run hard repository gate
        run: pnpm run lint

      - name: Recheck clean source after validation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"

      - name: Install checksum-pinned image scanners
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSLo /tmp/syft.deb "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.deb"
          echo "${SYFT_DEB_SHA256}  /tmp/syft.deb" | sha256sum -c -
          curl -fsSLo /tmp/grype.deb "https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}/grype_${GRYPE_VERSION}_linux_amd64.deb"
          echo "${GRYPE_DEB_SHA256}  /tmp/grype.deb" | sha256sum -c -
          sudo dpkg -i /tmp/syft.deb /tmp/grype.deb
          syft version
          grype version

      - name: Build and scan all three local role images before publication
        shell: bash
        run: |
          set -euo pipefail
          registry_base="ghcr.io/${GITHUB_REPOSITORY,,}"
          mkdir -p "${RELEASE_ROOT}/prepublish"
          for role in mesh_control_plane repo_patch_authority repo_patch_verifier; do
            case "$role" in
              mesh_control_plane)
                dockerfile="Dockerfile"
                repository="${registry_base}-control-plane"
                ;;
              repo_patch_authority)
                dockerfile="docker/repo-patch-authority.Dockerfile"
                repository="${registry_base}-authority"
                ;;
              repo_patch_verifier)
                dockerfile="docker/repo-patch-verifier.Dockerfile"
                repository="${registry_base}-verifier"
                ;;
              *)
                exit 1
                ;;
            esac
            image_tag="${repository}:sha-${GITHUB_SHA}"
            role_root="${RELEASE_ROOT}/prepublish/${role}"
            mkdir -p "$role_root"
            docker build --pull --file "$dockerfile" --tag "$image_tag" \
              --build-arg "MESH_BUILD_VERSION=sha-${GITHUB_SHA}" \
              --build-arg "MESH_BUILD_COMMIT=${GITHUB_SHA}" \
              .
            image_digest="$(docker image inspect "$image_tag" --format '{{.Id}}')"
            image_source="$(docker image inspect "$image_tag" --format '{{ index .Config.Labels "org.opencontainers.image.source" }}')"
            image_revision="$(docker image inspect "$image_tag" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
            image_version="$(docker image inspect "$image_tag" --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')"
            test "$image_source" = "https://github.com/${GITHUB_REPOSITORY}"
            test "$image_revision" = "$GITHUB_SHA"
            test "$image_version" = "sha-${GITHUB_SHA}"
            jq -n \
              --arg schema_version "mesh.image_source_binding.v1" \
              --arg role "$role" \
              --arg dockerfile "$dockerfile" \
              --arg image_tag "$image_tag" \
              --arg image_digest "$image_digest" \
              --arg source "$image_source" \
              --arg revision "$image_revision" \
              --arg version "$image_version" \
              '{schema_version: $schema_version, role: $role, dockerfile: $dockerfile, image: {tag: $image_tag, digest: $image_digest}, source: $source, revision: $revision, version: $version}' \
              > "$role_root/image-source-binding.json"
            python3 scripts/collect_release_image_metadata.py \
              --image-tag "$image_tag" \
              --output "$role_root/image-metadata.json" \
              --base-image-args "$role_root/base-image-digest.args" \
              --dockerfile "$dockerfile" \
              --expected-source "$image_source" \
              --expected-revision "$GITHUB_SHA" \
              --expected-version "sha-${GITHUB_SHA}" \
              --require-complete-base-images \
              > "$role_root/image-metadata-result.json"
            python3 scripts/generate_release_image_assurance.py \
              --image-tag "$image_tag" \
              --image-digest "$image_digest" \
              --raw-output-dir "$role_root/raw" \
              --output-dir "$role_root/normalized" \
              --exception-policy config/release-vulnerability-exceptions.json \
              > "$role_root/assurance-result.json"
            jq -e '.unaccepted_blocking_finding_count == 0' "$role_root/assurance-result.json" >/dev/null
            printf '%s\n' "$image_tag" > "$role_root/image-tag.txt"
            printf '%s\n' "$dockerfile" > "$role_root/dockerfile.txt"
          done

      - name: Validate externally provisioned verifier policy
        shell: bash
        run: |
          set -euo pipefail
          test "$REPO_PATCH_VERIFIER_SANDBOX_PROFILE_DIGEST" != ""
          test "$REPO_PATCH_VERIFIER_KEY_ID" != ""
          test "$REPO_PATCH_VERIFIER_PUBLIC_KEY_PEM" != ""
          test "${REPO_PATCH_VERIFIER_SANDBOX_PROFILE_DIGEST#sha256:}" != "$REPO_PATCH_VERIFIER_SANDBOX_PROFILE_DIGEST"
          mkdir -p "${RELEASE_ROOT}/policy"
          printf '%s\n' "$REPO_PATCH_VERIFIER_PUBLIC_KEY_PEM" > "${RELEASE_ROOT}/policy/verifier-public.pem"

      - name: Authenticate to GHCR only after all scans pass
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Publish immutable tags, resolve digests, and rescan published subjects
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RELEASE_ROOT}/published"
          for role in mesh_control_plane repo_patch_authority repo_patch_verifier; do
            prepublish_root="${RELEASE_ROOT}/prepublish/${role}"
            image_tag="$(cat "$prepublish_root/image-tag.txt")"
            dockerfile="$(cat "$prepublish_root/dockerfile.txt")"
            repository="${image_tag%:sha-*}"
            docker push "$image_tag"
            manifest_json="$(docker buildx imagetools inspect "$image_tag" --format '{{json .Manifest}}')"
            image_digest="$(printf '%s' "$manifest_json" | jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))')"
            immutable_ref="${repository}@${image_digest}"
            docker pull "$immutable_ref"
            role_root="${RELEASE_ROOT}/published/${role}"
            mkdir -p "$role_root"
            image_source="$(docker image inspect "$immutable_ref" --format '{{ index .Config.Labels "org.opencontainers.image.source" }}')"
            image_revision="$(docker image inspect "$immutable_ref" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
            image_version="$(docker image inspect "$immutable_ref" --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')"
            test "$image_source" = "https://github.com/${GITHUB_REPOSITORY}"
            test "$image_revision" = "$GITHUB_SHA"
            test "$image_version" = "sha-${GITHUB_SHA}"
            jq -n \
              --arg schema_version "mesh.image_source_binding.v1" \
              --arg role "$role" \
              --arg dockerfile "$dockerfile" \
              --arg image_tag "$immutable_ref" \
              --arg image_digest "$image_digest" \
              --arg source "$image_source" \
              --arg revision "$image_revision" \
              --arg version "$image_version" \
              '{schema_version: $schema_version, role: $role, dockerfile: $dockerfile, image: {tag: $image_tag, digest: $image_digest}, source: $source, revision: $revision, version: $version}' \
              > "$role_root/image-source-binding.json"
            python3 scripts/collect_release_image_metadata.py \
              --image-tag "$immutable_ref" \
              --output "$role_root/image-metadata.json" \
              --base-image-args "$role_root/base-image-digest.args" \
              --dockerfile "$dockerfile" \
              --expected-source "$image_source" \
              --expected-revision "$GITHUB_SHA" \
              --expected-version "sha-${GITHUB_SHA}" \
              --require-complete-base-images \
              > "$role_root/image-metadata-result.json"
            python3 scripts/generate_release_image_assurance.py \
              --image-tag "$immutable_ref" \
              --image-digest "$image_digest" \
              --raw-output-dir "$role_root/raw" \
              --output-dir "$role_root/normalized" \
              --exception-policy config/release-vulnerability-exceptions.json \
              > "$role_root/assurance-result.json"
            jq -e '.unaccepted_blocking_finding_count == 0' "$role_root/assurance-result.json" >/dev/null
            printf '%s\n' "$immutable_ref" > "$role_root/immutable-ref.txt"
            printf '%s\n' "$image_digest" > "$role_root/image-digest.txt"
            printf '%s\n' "$dockerfile" > "$role_root/dockerfile.txt"
            {
              echo "${role}_name=${repository}"
              echo "${role}_digest=${image_digest}"
              echo "${role}_ref=${immutable_ref}"
            } >> "$GITHUB_OUTPUT"
          done

      - name: Attest control-plane image provenance
        id: attest_control_plane
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763
        with:
          subject-name: ${{ steps.publish.outputs.mesh_control_plane_name }}
          subject-digest: ${{ steps.publish.outputs.mesh_control_plane_digest }}
          push-to-registry: true

      - name: Attest authority image provenance
        id: attest_authority
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763
        with:
          subject-name: ${{ steps.publish.outputs.repo_patch_authority_name }}
          subject-digest: ${{ steps.publish.outputs.repo_patch_authority_digest }}
          push-to-registry: true

      - name: Attest verifier image provenance
        id: attest_verifier
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763
        with:
          subject-name: ${{ steps.publish.outputs.repo_patch_verifier_name }}
          subject-digest: ${{ steps.publish.outputs.repo_patch_verifier_digest }}
          push-to-registry: true

      - name: Preserve OIDC attestation bundles
        shell: bash
        env:
          CONTROL_ATTESTATION: ${{ steps.attest_control_plane.outputs.bundle-path }}
          AUTHORITY_ATTESTATION: ${{ steps.attest_authority.outputs.bundle-path }}
          VERIFIER_ATTESTATION: ${{ steps.attest_verifier.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp "$CONTROL_ATTESTATION" "${RELEASE_ROOT}/published/mesh_control_plane/github-oidc-attestation.json"
          cp "$AUTHORITY_ATTESTATION" "${RELEASE_ROOT}/published/repo_patch_authority/github-oidc-attestation.json"
          cp "$VERIFIER_ATTESTATION" "${RELEASE_ROOT}/published/repo_patch_verifier/github-oidc-attestation.json"

      - name: Generate exact-commit Mesh CI attestations
        shell: bash
        run: |
          set -euo pipefail
          for role in mesh_control_plane repo_patch_authority repo_patch_verifier; do
            role_root="${RELEASE_ROOT}/published/${role}"
            immutable_ref="$(cat "$role_root/immutable-ref.txt")"
            image_digest="$(cat "$role_root/image-digest.txt")"
            dockerfile="$(cat "$role_root/dockerfile.txt")"
            mapfile -t base_image_args < "$role_root/base-image-digest.args"
            python3 scripts/generate_ci_attestation.py \
              --output "$role_root/ci-attestation.json" \
              --source-sha "$GITHUB_SHA" \
              --image-tag "$immutable_ref" \
              --image-digest "$image_digest" \
              --build-command "docker build --pull --file ${dockerfile} --tag ${immutable_ref%@*}:sha-${GITHUB_SHA} --build-arg MESH_BUILD_VERSION=sha-${GITHUB_SHA} --build-arg MESH_BUILD_COMMIT=${GITHUB_SHA} ." \
              "${base_image_args[@]}" \
              --check pnpm-lint \
              --check image-source-binding \
              --check image-materials-binding \
              --check prepublish-image-assurance \
              --check published-image-assurance \
              --check github-oidc-provenance \
              --require-github-actions \
              > "$role_root/ci-attestation-result.json"
          done

      - name: Generate three-role evidence bundle
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/generate_repo_patch_service_image_bundle.py \
            --artifact-root "$GITHUB_WORKSPACE" \
            --git-commit "$GITHUB_SHA" \
            --output "${RELEASE_ROOT}/repo-patch-service-image-bundle.json" \
            --mesh-control-plane-image-tag "${{ steps.publish.outputs.mesh_control_plane_ref }}" \
            --mesh-control-plane-image-digest "${{ steps.publish.outputs.mesh_control_plane_digest }}" \
            --mesh-control-plane-sbom "${RELEASE_ROOT}/published/mesh_control_plane/normalized/sbom.cdx.json" \
            --mesh-control-plane-raw-vulnerability-scan "${RELEASE_ROOT}/published/mesh_control_plane/raw/raw-vulnerability-scan.grype.json" \
            --mesh-control-plane-vulnerability-scan "${RELEASE_ROOT}/published/mesh_control_plane/normalized/vulnerability-scan.json" \
            --mesh-control-plane-vulnerability-evidence "${RELEASE_ROOT}/published/mesh_control_plane/raw/release-vulnerability-evidence.json" \
            --mesh-control-plane-image-metadata "${RELEASE_ROOT}/published/mesh_control_plane/image-metadata.json" \
            --mesh-control-plane-ci-attestation "${RELEASE_ROOT}/published/mesh_control_plane/ci-attestation.json" \
            --repo-patch-authority-image-tag "${{ steps.publish.outputs.repo_patch_authority_ref }}" \
            --repo-patch-authority-image-digest "${{ steps.publish.outputs.repo_patch_authority_digest }}" \
            --repo-patch-authority-sbom "${RELEASE_ROOT}/published/repo_patch_authority/normalized/sbom.cdx.json" \
            --repo-patch-authority-raw-vulnerability-scan "${RELEASE_ROOT}/published/repo_patch_authority/raw/raw-vulnerability-scan.grype.json" \
            --repo-patch-authority-vulnerability-scan "${RELEASE_ROOT}/published/repo_patch_authority/normalized/vulnerability-scan.json" \
            --repo-patch-authority-vulnerability-evidence "${RELEASE_ROOT}/published/repo_patch_authority/raw/release-vulnerability-evidence.json" \
            --repo-patch-authority-image-metadata "${RELEASE_ROOT}/published/repo_patch_authority/image-metadata.json" \
            --repo-patch-authority-ci-attestation "${RELEASE_ROOT}/published/repo_patch_authority/ci-attestation.json" \
            --repo-patch-verifier-image-tag "${{ steps.publish.outputs.repo_patch_verifier_ref }}" \
            --repo-patch-verifier-image-digest "${{ steps.publish.outputs.repo_patch_verifier_digest }}" \
            --repo-patch-verifier-sbom "${RELEASE_ROOT}/published/repo_patch_verifier/normalized/sbom.cdx.json" \
            --repo-patch-verifier-raw-vulnerability-scan "${RELEASE_ROOT}/published/repo_patch_verifier/raw/raw-vulnerability-scan.grype.json" \
            --repo-patch-verifier-vulnerability-scan "${RELEASE_ROOT}/published/repo_patch_verifier/normalized/vulnerability-scan.json" \
            --repo-patch-verifier-vulnerability-evidence "${RELEASE_ROOT}/published/repo_patch_verifier/raw/release-vulnerability-evidence.json" \
            --repo-patch-verifier-image-metadata "${RELEASE_ROOT}/published/repo_patch_verifier/image-metadata.json" \
            --repo-patch-verifier-ci-attestation "${RELEASE_ROOT}/published/repo_patch_verifier/ci-attestation.json" \
            --verifier-sandbox-profile-digest "$REPO_PATCH_VERIFIER_SANDBOX_PROFILE_DIGEST" \
            --verifier-key-id "$REPO_PATCH_VERIFIER_KEY_ID" \
            --verifier-public-key "${RELEASE_ROOT}/policy/verifier-public.pem"

      - name: Re-resolve registry digests and verify bundle against external expectations
        shell: bash
        run: |
          set -euo pipefail
          for role in mesh_control_plane repo_patch_authority repo_patch_verifier; do
            role_root="${RELEASE_ROOT}/published/${role}"
            immutable_ref="$(cat "$role_root/immutable-ref.txt")"
            repository="${immutable_ref%@*}"
            expected_digest="$(cat "$role_root/image-digest.txt")"
            observed_json="$(docker buildx imagetools inspect "$repository:sha-${GITHUB_SHA}" --format '{{json .Manifest}}')"
            observed_digest="$(printf '%s' "$observed_json" | jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))')"
            test "$observed_digest" = "$expected_digest"
          done
          python3 scripts/verify_repo_patch_service_image_bundle.py \
            --bundle "${RELEASE_ROOT}/repo-patch-service-image-bundle.json" \
            --artifact-root "$GITHUB_WORKSPACE" \
            --expected-git-commit "$GITHUB_SHA" \
            --expected-mesh-control-plane-image-tag "${{ steps.publish.outputs.mesh_control_plane_ref }}" \
            --expected-mesh-control-plane-image-digest "${{ steps.publish.outputs.mesh_control_plane_digest }}" \
            --expected-repo-patch-authority-image-tag "${{ steps.publish.outputs.repo_patch_authority_ref }}" \
            --expected-repo-patch-authority-image-digest "${{ steps.publish.outputs.repo_patch_authority_digest }}" \
            --expected-repo-patch-verifier-image-tag "${{ steps.publish.outputs.repo_patch_verifier_ref }}" \
            --expected-repo-patch-verifier-image-digest "${{ steps.publish.outputs.repo_patch_verifier_digest }}" \
            --expected-verifier-sandbox-profile-digest "$REPO_PATCH_VERIFIER_SANDBOX_PROFILE_DIGEST" \
            --expected-verifier-key-id "$REPO_PATCH_VERIFIER_KEY_ID" \
            --expected-verifier-public-key "${RELEASE_ROOT}/policy/verifier-public.pem" \
            --json \
            > "${RELEASE_ROOT}/repo-patch-service-image-bundle-verification.json"

      - name: Upload bounded release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: repo-patch-service-image-release-${{ github.sha }}
          path: dist/repo-patch-service-release/
          if-no-files-found: warn
          retention-days: 14
