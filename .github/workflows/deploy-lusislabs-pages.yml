name: Deploy Mesh UI to GitHub Pages

# State slice: github-pages-operator-ui.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-mesh-ui
  cancel-in-progress: false

env:
  MESH_PAGES_HOST: lusislabs.com
  NEXT_PUBLIC_MESH_API_URL: https://app.lusislabs.com

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Next route types
        run: pnpm --dir meshapp/frontend exec next typegen

      - name: Build static Mesh UI
        run: pnpm --dir meshapp/frontend run build

      - name: Add custom-domain metadata
        run: printf '%s\n' "$MESH_PAGES_HOST" > meshapp/frontend/out/CNAME

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: meshapp/frontend/out

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
