name: Deploy Lusis Labs Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-lusislabs-preview
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, lusislabs-preview]
    env:
      DEPLOY_SHA: ${{ github.sha }}
    steps:
      - name: Checkout repository without marketplace actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git remote remove origin >/dev/null 2>&1 || true
          scrub_origin() {
            git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git" >/dev/null 2>&1 || true
          }
          trap scrub_origin EXIT
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if ! git fetch --depth=1 origin "$DEPLOY_SHA"; then
            scrub_origin
            echo "::warning::GITHUB_TOKEN fetch failed; retrying without token"
            if ! git fetch --depth=1 origin "$DEPLOY_SHA"; then
              echo "::warning::HTTPS fetch failed; retrying with runner SSH credentials"
              git remote set-url origin "git@github.com:${GITHUB_REPOSITORY}.git"
              GIT_SSH_COMMAND="ssh -o StrictHostKeyChecking=accept-new" git fetch --depth=1 origin "$DEPLOY_SHA"
            fi
          fi
          git checkout --detach --force FETCH_HEAD
          git reset --hard FETCH_HEAD
          git clean -ffdx
          scrub_origin
          trap - EXIT

      - name: Prepare deployment source metadata
        run: |
          set -euo pipefail
          printf '%s\n' "$DEPLOY_SHA" > .deploy-commit
          printf '%s\n' "${GITHUB_REF_NAME:-main}" > .deploy-branch

      - name: Run server deployment
        run: |
          set -euo pipefail
          sudo /usr/local/bin/deploy-lusis-mesh-webapp --source "$GITHUB_WORKSPACE"
