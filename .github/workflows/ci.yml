name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

env:
  SYFT_VERSION: "1.44.0"
  SYFT_DEB_SHA256: 82d374ac6179acda9d0b6b3e694ecfda54dfbd9da8e29e02dc81f92d67dc103b
  GRYPE_VERSION: "0.112.0"
  GRYPE_DEB_SHA256: 434bae8af635b6308d7a33ea842c6216dc382d4ec49fe3873f927b7805cc69e2
  MESH_CI_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.MESH_CI_SOURCE_SHA }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff==0.7.4
      - name: Lint
        run: ruff check .

  python-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONFAULTHANDLER: "1"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.MESH_CI_SOURCE_SHA }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Python test dependencies
        run: python -m pip install "cryptography>=44,<47" "psycopg[binary,pool]>=3.2,<4"
      - name: Run Darkharness packet tests
        run: python -W ignore::DeprecationWarning -m unittest tests.test_perennial_materialization tests.test_darkharness_packet tests.test_darkharness_policy tests.test_darkharness_export_path tests.test_darkharness_live_verifier -v
      - name: Run unit tests
        run: python -W ignore::DeprecationWarning -m unittest discover -s tests -v
      - name: Smoke-import RuntimeConfig
        run: python -c "from shared.mesh_runtime import RuntimeConfig; print('RuntimeConfig OK on', RuntimeConfig.from_env().environment)"

  breakthrough-proof-replay:
    runs-on: ubuntu-latest
    needs: [python-lint]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.MESH_CI_SOURCE_SHA }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff==0.7.4
      - name: Run breakthrough proof replay tests
        run: python -m unittest tests.test_breakthrough_evidence_bundle tests.test_production_node_breakthrough_session tests.test_compose_chaos_session tests.test_pilot_breakthrough_packet -v
      - name: Lint breakthrough proof surfaces
        run: ruff check scripts/breakthrough_evidence_bundle.py scripts/production_node_breakthrough_session.py scripts/compose_chaos_session.py scripts/generate_pilot_breakthrough_packet.py tests/test_breakthrough_evidence_bundle.py tests/test_production_node_breakthrough_session.py tests/test_compose_chaos_session.py tests/test_pilot_breakthrough_packet.py
      - name: Compile breakthrough proof surfaces
        run: python -m py_compile scripts/breakthrough_evidence_bundle.py scripts/production_node_breakthrough_session.py scripts/compose_chaos_session.py scripts/generate_pilot_breakthrough_packet.py tests/test_breakthrough_evidence_bundle.py tests/test_production_node_breakthrough_session.py tests/test_compose_chaos_session.py tests/test_pilot_breakthrough_packet.py

  simulation-matrix:
    runs-on: ubuntu-latest
    needs: [python-lint]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.MESH_CI_SOURCE_SHA }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Run small randomized simulation matrix
        run: python scripts/run_simulation_matrix.py --iterations 4 --workers 2 --timeout-seconds 45 --randomize --seed 20260424 --output .mesh-runtime-state/simulation-stress/ci-small

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install uv for root pnpm gates
        run: python -m pip install uv
      - name: Enable pnpm for setup-node cache
        run: corepack enable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Enable pnpm for Node 22
        run: corepack enable
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browser
        run: pnpm --dir web exec playwright install --with-deps chromium
      - name: Run heavy root gate
        run: pnpm run lint
      - name: Build web
        run: pnpm --dir web run build
      - name: Build meshapp
        run: pnpm --dir meshapp/frontend run build

  docker-build:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    needs: [python-test, breakthrough-proof-replay, web]
    env:
      MESH_POLICY_SIGNING_KEY: ${{ secrets.MESH_POLICY_SIGNING_KEY }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mesh
          POSTGRES_USER: mesh
          POSTGRES_PASSWORD: mesh
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mesh -d mesh"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.MESH_CI_SOURCE_SHA }}
      - name: Build Docker image
        run: docker build --build-arg MESH_BUILD_VERSION=ci-${{ github.run_number }} --build-arg MESH_BUILD_COMMIT=${MESH_CI_SOURCE_SHA} -t orbital-mesh:ci .
      - name: Collect release image metadata
        run: |
          mkdir -p dist
          python scripts/collect_release_image_metadata.py \
            --image-tag orbital-mesh:ci \
            --output dist/release-image-metadata.json \
            --github-env "$GITHUB_ENV" \
            --base-image-args dist/base-image-digest.args
      - name: Install migration rehearsal dependency
        run: python -m pip install "psycopg[binary]>=3.2,<4"
      - name: Run Postgres migration rehearsal
        env:
          MESH_MIGRATION_REHEARSAL_DATABASE_URL: postgresql://mesh:mesh@127.0.0.1:5432/mesh
        run: |
          python scripts/run_postgres_migration_rehearsal.py \
            --output dist/migration-rehearsal.json \
            --operator-id github-actions \
            --environment ci \
            --rehearsal-id "ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --json
      - name: Healthcheck smoke test
        run: |
          set -euo pipefail
          docker run -d --name mesh-ci \
            -e MESH_SERVER_HOST=0.0.0.0 \
            -e MESH_SERVER_PORT=8787 \
            -e MESH_ENVIRONMENT=ci \
            -e MESH_BUILD_COMMIT="${MESH_CI_SOURCE_SHA}" \
            -e MESH_BUILD_IMAGE_DIGEST="${MESH_IMAGE_DIGEST}" \
            -e MESH_GITNEXUS_DISABLE_AUTOSTART=1 \
            -p 8787:8787 \
            orbital-mesh:ci
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8787/api/health > /dev/null; then
              echo "Server healthy after ${i}s"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Server failed to become healthy in 30s"
              docker logs mesh-ci || true
              exit 1
            fi
            sleep 1
          done
          curl -sf http://localhost:8787/api/health | tee /dev/stderr | python3 -c "import os, sys, json; payload=json.load(sys.stdin); assert payload['status'] == 'ok'; assert payload['commit'] == os.environ['MESH_CI_SOURCE_SHA']; assert payload['image_digest'] == os.environ['MESH_IMAGE_DIGEST']"
      - name: Capture container logs on failure
        if: failure()
        run: docker logs mesh-ci || true
      - name: Stop container
        if: always()
        run: docker stop mesh-ci || true
      - name: Prune Docker build cache before release scanners
        run: |
          docker builder prune --force
          docker image prune --force
          df -h
      - name: Install release scanners
        run: |
          curl -fsSLo /tmp/syft.deb "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.deb"
          echo "${SYFT_DEB_SHA256}  /tmp/syft.deb" | sha256sum -c -
          sudo dpkg -i /tmp/syft.deb
          curl -fsSLo /tmp/grype.deb "https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}/grype_${GRYPE_VERSION}_linux_amd64.deb"
          echo "${GRYPE_DEB_SHA256}  /tmp/grype.deb" | sha256sum -c -
          sudo dpkg -i /tmp/grype.deb
          syft version
          grype version
      - name: Generate release image assurance artifacts
        id: release_assurance
        continue-on-error: true
        run: |
          python scripts/generate_release_image_assurance.py \
            --image-tag orbital-mesh:ci \
            --image-digest "$MESH_IMAGE_DIGEST" \
            --raw-output-dir dist/release-assurance-raw \
            --output-dir dist/release-assurance \
            --exception-policy config/release-vulnerability-exceptions.json
      - name: Generate CI attestation
        if: always()
        env:
          RELEASE_ASSURANCE_OUTCOME: ${{ steps.release_assurance.outcome }}
        run: |
          set -euo pipefail
          BASE_IMAGE_ARGS=()
          if [ -f dist/base-image-digest.args ]; then
            mapfile -t BASE_IMAGE_ARGS < dist/base-image-digest.args
          fi
          docker_build_status=failed
          if [ "$RELEASE_ASSURANCE_OUTCOME" = "success" ]; then
            docker_build_status=passed
          fi
          python scripts/generate_ci_attestation.py \
            --output dist/ci-attestation.json \
            --require-github-actions \
            --check python-test \
            --check web \
            --check-status "docker-build=${docker_build_status}" \
            --image-tag orbital-mesh:ci \
            --image-digest "${MESH_IMAGE_DIGEST:-}" \
            --source-sha "${MESH_CI_SOURCE_SHA}" \
            --build-command "docker build --build-arg MESH_BUILD_VERSION=ci-${GITHUB_RUN_NUMBER} --build-arg MESH_BUILD_COMMIT=${MESH_CI_SOURCE_SHA} -t orbital-mesh:ci ." \
            "${BASE_IMAGE_ARGS[@]}"
      - name: Generate release provenance draft
        if: always()
        run: |
          set -euo pipefail
          BASE_IMAGE_ARGS=()
          if [ -f dist/base-image-digest.args ]; then
            mapfile -t BASE_IMAGE_ARGS < dist/base-image-digest.args
          fi
          python scripts/generate_release_provenance.py \
            --output dist/release-provenance-draft.json \
            --image-tag orbital-mesh:ci \
            --ci-attestation dist/ci-attestation.json \
            --migration-rehearsal dist/migration-rehearsal.json \
            --sbom dist/release-assurance/sbom.cdx.json \
            --vulnerability-scan dist/release-assurance/vulnerability-scan.json \
            --build-command "docker build --build-arg MESH_BUILD_VERSION=ci-${GITHUB_RUN_NUMBER} --build-arg MESH_BUILD_COMMIT=${MESH_CI_SOURCE_SHA} -t orbital-mesh:ci ." \
            --policy-signing-key "$MESH_POLICY_SIGNING_KEY" \
            --json \
            "${BASE_IMAGE_ARGS[@]}"
      - name: Fail on release image assurance errors
        if: steps.release_assurance.outcome != 'success'
        run: exit 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ci-attestation
          path: dist/ci-attestation.json
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: release-assurance-artifacts
          path: |
            dist/release-assurance/
            dist/release-assurance-raw/
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: release-provenance-draft
          path: |
            dist/release-image-metadata.json
            dist/migration-rehearsal.json
            dist/release-provenance-draft.json
          retention-days: 30
