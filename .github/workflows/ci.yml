name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff==0.7.4
      - name: Lint
        run: ruff check .

  python-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Darkharness crypto dependency
        run: python -m pip install "cryptography>=44,<47"
      - name: Run Darkharness packet tests
        run: python -W ignore::DeprecationWarning -m unittest tests.test_perennial_materialization tests.test_darkharness_packet tests.test_darkharness_policy tests.test_darkharness_export_path -v
      - name: Run unit tests
        run: python -W ignore::DeprecationWarning -m unittest discover -s tests -v
      - name: Smoke-import RuntimeConfig
        run: python -c "from shared.mesh_runtime import RuntimeConfig; print('RuntimeConfig OK on', RuntimeConfig.from_env().environment)"

  simulation-matrix:
    runs-on: ubuntu-latest
    needs: [python-lint]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Run small randomized simulation matrix
        run: python scripts/run_simulation_matrix.py --iterations 4 --workers 2 --timeout-seconds 20 --randomize --seed 20260424 --output .mesh-runtime-state/simulation-stress/ci-small

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Test
        run: npm test --silent

  docker-build:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    needs: [python-test]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Build Docker image
        run: docker build --build-arg MESH_BUILD_VERSION=ci-${{ github.run_number }} --build-arg MESH_BUILD_COMMIT=${{ github.sha }} -t orbital-mesh:ci .
      - name: Healthcheck smoke test
        run: |
          set -euo pipefail
          docker run -d --name mesh-ci \
            -e MESH_SERVER_HOST=0.0.0.0 \
            -e MESH_SERVER_PORT=8787 \
            -e MESH_ENVIRONMENT=ci \
            -e MESH_GITNEXUS_DISABLE_AUTOSTART=1 \
            -p 8787:8787 \
            orbital-mesh:ci
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8787/api/health > /dev/null; then
              echo "Server healthy after ${i}s"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Server failed to become healthy in 30s"
              docker logs mesh-ci || true
              exit 1
            fi
            sleep 1
          done
          curl -sf http://localhost:8787/api/health | tee /dev/stderr | python3 -c "import sys, json; assert json.load(sys.stdin)['status'] == 'ok'"
      - name: Capture container logs on failure
        if: failure()
        run: docker logs mesh-ci || true
      - name: Stop container
        if: always()
        run: docker stop mesh-ci || true
