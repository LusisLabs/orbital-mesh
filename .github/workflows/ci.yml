name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  mesh-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install linter
        run: pip install ruff
      - name: Lint Python
        run: ruff check .
      - name: Run Python tests
        run: python3 -m unittest discover -s tests -v

  mesh-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - run: npm run build
      - run: npm test

  swarmclaw-typecheck:
    if: ${{ hashFiles('swarmclaw/package.json') != '' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: swarmclaw
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: swarmclaw/package-lock.json
      - run: npm ci
      - run: npm run type-check
