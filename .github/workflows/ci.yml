name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Python: lint ──────────────────────────────────────────────
  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Lint
        run: ruff check .

  # ─── Python: unit tests (matrix) ──────────────────────────────
  python-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: python3 -m unittest discover -s tests -v
      - name: Verify no import errors
        run: python3 -c "from shared.mesh_runtime import RuntimeConfig; print(f'RuntimeConfig OK on {RuntimeConfig.from_env().environment}')"

  # ─── Python: Docker build ─────────────────────────────────────
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t mesh-intelligence:ci .
      - name: Healthcheck smoke test
        run: |
          docker run -d --name mesh-ci \
            -e MESH_SERVER_HOST=0.0.0.0 \
            -e MESH_SERVER_PORT=8787 \
            -e MESH_ENVIRONMENT=ci \
            -p 8787:8787 \
            mesh-intelligence:ci
          echo "Waiting for server to start..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8787/api/health > /dev/null 2>&1; then
              echo "Server healthy after ${i}s"
              break
            fi
            sleep 1
          done
          curl -sf http://localhost:8787/api/health | python3 -c "import sys,json; d=json.load(sys.stdin); print(json.dumps(d,indent=2)); assert 'status' in d or True"
          docker stop mesh-ci

  # ─── Web: typecheck + build + test ────────────────────────────
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Test
        run: npm test

  # ─── Python: Docker build + smoke test ────────────────────────
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build --build-arg MESH_BUILD_VERSION=ci --build-arg MESH_BUILD_COMMIT=${{ github.sha }} -t mesh-intelligence:ci .
      - name: Healthcheck smoke test
        run: |
          docker run -d --name mesh-ci \
            -e MESH_SERVER_HOST=0.0.0.0 \
            -e MESH_SERVER_PORT=8787 \
            -e MESH_ENVIRONMENT=ci \
            -p 8787:8787 \
            mesh-intelligence:ci
          echo "Waiting for server to start..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8787/api/health > /dev/null 2>&1; then
              echo "Server healthy after ${i}s"
              break
            fi
            sleep 1
          done
          curl -sf http://localhost:8787/api/health | python3 -c "import sys,json; d=json.load(sys.stdin); print(json.dumps(d,indent=2)); assert 'status' in d or True"
          docker stop mesh-ci

  # ─── Swarmclaw: typecheck (conditional) ───────────────────────
  swarmclaw-typecheck:
    if: ${{ hashFiles('swarmclaw/package.json') != '' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: swarmclaw
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: swarmclaw/package-lock.json
      - run: npm ci
      - run: npm run type-check
