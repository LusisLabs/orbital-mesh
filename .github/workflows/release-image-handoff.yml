name: Release Image Handoff

on:
  workflow_dispatch:
    inputs:
      confirm_export:
        description: Type EXPORT_RELEASE_IMAGE to upload a runnable private image artifact.
        required: true
        type: string
      retention_days:
        description: GitHub artifact retention in days.
        required: true
        default: "3"
        type: string

permissions:
  contents: read

concurrency:
  group: release-image-handoff-${{ github.ref }}
  cancel-in-progress: false

env:
  SYFT_VERSION: "1.44.0"
  SYFT_DEB_SHA256: 82d374ac6179acda9d0b6b3e694ecfda54dfbd9da8e29e02dc81f92d67dc103b
  GRYPE_VERSION: "0.112.0"
  GRYPE_DEB_SHA256: 434bae8af635b6308d7a33ea842c6216dc382d4ec49fe3873f927b7805cc69e2

jobs:
  validate-approval:
    runs-on: ubuntu-latest
    steps:
      - name: Validate explicit export approval
        env:
          CONFIRM_EXPORT: ${{ inputs.confirm_export }}
          RETENTION_DAYS: ${{ inputs.retention_days }}
        run: |
          set -euo pipefail
          if [ "$CONFIRM_EXPORT" != "EXPORT_RELEASE_IMAGE" ]; then
            echo "confirm_export must be EXPORT_RELEASE_IMAGE" >&2
            exit 1
          fi
          case "$RETENTION_DAYS" in
            ''|*[!0-9]*)
              echo "retention_days must be an integer" >&2
              exit 1
              ;;
          esac
          if [ "$RETENTION_DAYS" -lt 1 ] || [ "$RETENTION_DAYS" -gt 7 ]; then
            echo "retention_days must be between 1 and 7" >&2
            exit 1
          fi

  release-image-handoff:
    runs-on: ubuntu-latest
    needs: validate-approval
    env:
      HANDOFF_IMAGE_TAG: orbital-mesh:handoff-${{ github.run_id }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mesh
          POSTGRES_USER: mesh
          POSTGRES_PASSWORD: mesh
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mesh -d mesh"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Python test dependency
        run: python -m pip install "cryptography>=44,<47" "psycopg[binary]>=3.2,<4"
      - name: Run Python tests
        run: python -W ignore::DeprecationWarning -m unittest discover -s tests -v
      - name: Run web gates
        run: |
          set -euo pipefail
          npm --prefix web ci
          npm --prefix web run lint
          npm --prefix web run build
          npm --prefix web test --silent
      - name: Run release static gates
        run: |
          set -euo pipefail
          python scripts/verify_release_cut_list.py --json
          python scripts/verify_security_audit_readiness.py --json
      - name: Build Docker image
        run: |
          set -euo pipefail
          docker build \
            --build-arg MESH_BUILD_VERSION=handoff-${GITHUB_RUN_NUMBER} \
            --build-arg MESH_BUILD_COMMIT=${GITHUB_SHA} \
            -t "$HANDOFF_IMAGE_TAG" .
      - name: Collect release image metadata
        run: |
          mkdir -p dist/release-image-handoff
          python scripts/collect_release_image_metadata.py \
            --image-tag "$HANDOFF_IMAGE_TAG" \
            --output dist/release-image-metadata.json \
            --github-env "$GITHUB_ENV" \
            --base-image-args dist/base-image-digest.args
      - name: Run Postgres migration rehearsal
        env:
          MESH_MIGRATION_REHEARSAL_DATABASE_URL: postgresql://mesh:mesh@127.0.0.1:5432/mesh
        run: |
          python scripts/run_postgres_migration_rehearsal.py \
            --output dist/migration-rehearsal.json \
            --operator-id github-actions \
            --environment ci \
            --rehearsal-id "handoff-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --json
      - name: Save runnable image archive
        run: |
          set -euo pipefail
          docker save "$HANDOFF_IMAGE_TAG" -o dist/release-image-handoff/orbital-mesh-handoff-image.tar
          gzip -n dist/release-image-handoff/orbital-mesh-handoff-image.tar
      - name: Install release scanners
        run: |
          curl -fsSLo /tmp/syft.deb "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.deb"
          echo "${SYFT_DEB_SHA256}  /tmp/syft.deb" | sha256sum -c -
          sudo dpkg -i /tmp/syft.deb
          curl -fsSLo /tmp/grype.deb "https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}/grype_${GRYPE_VERSION}_linux_amd64.deb"
          echo "${GRYPE_DEB_SHA256}  /tmp/grype.deb" | sha256sum -c -
          sudo dpkg -i /tmp/grype.deb
      - name: Generate release image assurance artifacts
        run: |
          python scripts/generate_release_image_assurance.py \
            --image-tag "$HANDOFF_IMAGE_TAG" \
            --image-digest "$MESH_IMAGE_DIGEST" \
            --raw-output-dir dist/release-assurance-raw \
            --output-dir dist/release-assurance \
            --exception-policy config/release-vulnerability-exceptions.json
      - name: Generate CI attestation
        run: |
          set -euo pipefail
          BASE_IMAGE_ARGS=()
          if [ -f dist/base-image-digest.args ]; then
            mapfile -t BASE_IMAGE_ARGS < dist/base-image-digest.args
          fi
          python scripts/generate_ci_attestation.py \
            --output dist/ci-attestation.json \
            --require-github-actions \
            --check python-test \
            --check web \
            --check release-cut-list \
            --check security-audit-readiness \
            --check docker-build \
            --check release-image-assurance \
            --image-tag "$HANDOFF_IMAGE_TAG" \
            --image-digest "$MESH_IMAGE_DIGEST" \
            --build-command "docker build --build-arg MESH_BUILD_VERSION=handoff-${GITHUB_RUN_NUMBER} --build-arg MESH_BUILD_COMMIT=${GITHUB_SHA} -t $HANDOFF_IMAGE_TAG ." \
            "${BASE_IMAGE_ARGS[@]}"
      - name: Generate release provenance draft
        env:
          MESH_POLICY_SIGNING_KEY: ${{ secrets.MESH_POLICY_SIGNING_KEY }}
        run: |
          set -euo pipefail
          BASE_IMAGE_ARGS=()
          if [ -f dist/base-image-digest.args ]; then
            mapfile -t BASE_IMAGE_ARGS < dist/base-image-digest.args
          fi
          python scripts/generate_release_provenance.py \
            --output dist/release-provenance-draft.json \
            --image-tag "$HANDOFF_IMAGE_TAG" \
            --ci-attestation dist/ci-attestation.json \
            --migration-rehearsal dist/migration-rehearsal.json \
            --sbom dist/release-assurance/sbom.cdx.json \
            --vulnerability-scan dist/release-assurance/vulnerability-scan.json \
            --build-command "docker build --build-arg MESH_BUILD_VERSION=handoff-${GITHUB_RUN_NUMBER} --build-arg MESH_BUILD_COMMIT=${GITHUB_SHA} -t $HANDOFF_IMAGE_TAG ." \
            --policy-signing-key "$MESH_POLICY_SIGNING_KEY" \
            --json \
            "${BASE_IMAGE_ARGS[@]}"
      - name: Generate release image handoff manifest
        env:
          CONFIRM_EXPORT: ${{ inputs.confirm_export }}
        run: |
          python scripts/generate_release_image_handoff.py \
            --image-tag "$HANDOFF_IMAGE_TAG" \
            --image-digest "$MESH_IMAGE_DIGEST" \
            --git-commit "$GITHUB_SHA" \
            --image-archive dist/release-image-handoff/orbital-mesh-handoff-image.tar.gz \
            --ci-attestation dist/ci-attestation.json \
            --migration-rehearsal dist/migration-rehearsal.json \
            --sbom dist/release-assurance/sbom.cdx.json \
            --vulnerability-scan dist/release-assurance/vulnerability-scan.json \
            --release-provenance dist/release-provenance-draft.json \
            --confirmation "$CONFIRM_EXPORT" \
            --output dist/release-image-handoff/release-image-handoff.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-image-handoff-${{ github.sha }}
          path: |
            dist/release-image-handoff/
            dist/release-image-metadata.json
            dist/ci-attestation.json
            dist/migration-rehearsal.json
            dist/release-provenance-draft.json
            dist/release-assurance/
            dist/release-assurance-raw/
          retention-days: ${{ inputs.retention_days }}
