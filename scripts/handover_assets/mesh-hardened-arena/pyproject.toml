[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mesh-hardened-arena"
version = "0.1.0"
description = "Hardened Arena supply-chain profile, packet, intent, and proof toolkit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
license = { text = "MIT" }
authors = [{ name = "Mesh Intelligence Contributors" }]
keywords = ["hardened-images", "supply-chain", "deployment", "mesh"]
[project.urls]
Homepage = "https://github.com/LusisLabs/mesh-hardened-arena"
Repository = "https://github.com/LusisLabs/mesh-hardened-arena"

[project.scripts]
mesh-hardened-arena = "mesh_hardened_arena.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mesh_hardened_arena = ["schemas/**/*.json"]
