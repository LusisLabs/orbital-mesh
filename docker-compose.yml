services:
  mesh:
    build: .
    init: true
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2"
        reservations:
          memory: 512M
          cpus: "0.5"
    ports:
      - "${MESH_PUBLISH_PORT:-8787}:8787"
    environment:
      MESH_SERVER_HOST: "${MESH_SERVER_HOST:-0.0.0.0}"
      MESH_SERVER_PORT: "${MESH_SERVER_PORT:-8787}"
      MESH_ENVIRONMENT: "${MESH_ENVIRONMENT:-production}"
      MESH_WEB_ASSET_PATH: /app/meshapp/frontend/out
      MESH_STATE_DIRECTORY: /app/.mesh-runtime-state
      HERMES_HOME: /workspace/orbital-mesh/.hermes-local
      MESH_RESEARCH_DIRECTORY: "${MESH_RESEARCH_DIRECTORY:-/app/.mesh-runtime-state/research}"
      MESH_VAULT_PATH: /app/.mesh-runtime-state/vault
      MESH_INTEGRATIONS_CONFIG_PATH: /app/.mesh-runtime-state/integrations.json
      MESH_PROMPTFOO_COMMAND: "${MESH_PROMPTFOO_COMMAND:-promptfoo}"
      MESH_HERMES_COMMAND: "${MESH_HERMES_COMMAND:-hermes}"
      MESH_HERMES_COMMAND_TIMEOUT_SECONDS: "${MESH_HERMES_COMMAND_TIMEOUT_SECONDS:-180}"
      MESH_GOOSE_COMMAND: "${MESH_GOOSE_COMMAND:-goose}"
      MESH_GOOSE_COMMAND_TIMEOUT_SECONDS: "${MESH_GOOSE_COMMAND_TIMEOUT_SECONDS:-180}"
      MESH_EVO_COMMAND: "${MESH_EVO_COMMAND:-}"
      MESH_EVO_COMMAND_TIMEOUT_SECONDS: "${MESH_EVO_COMMAND_TIMEOUT_SECONDS:-60}"
      MESH_ACCESS_LOG: "${MESH_ACCESS_LOG:-1}"
      MESH_STRUCTURED_LOGS: "${MESH_STRUCTURED_LOGS:-1}"
      MESH_SECURITY_HEADERS: "${MESH_SECURITY_HEADERS:-true}"
      MESH_MAX_JSON_BODY_BYTES: "${MESH_MAX_JSON_BODY_BYTES:-1048576}"
      MESH_VAULT_AI_POSTPROCESS_ENABLED: "${MESH_VAULT_AI_POSTPROCESS_ENABLED:-0}"
      HERMES_INFERENCE_PROVIDER: "${MESH_COMPOSE_HERMES_INFERENCE_PROVIDER:-openai}"
      HERMES_MODEL: "${MESH_COMPOSE_HERMES_MODEL:-MiniMax-M2.7}"
      LLM_MODEL: "${MESH_COMPOSE_LLM_MODEL:-MiniMax-M2.7}"
      GOOSE_PROVIDER: "${MESH_COMPOSE_GOOSE_PROVIDER:-openai}"
      GOOSE_MODEL: "${MESH_COMPOSE_GOOSE_MODEL:-MiniMax-M2.5}"
      GOOSE_FALLBACK_PROVIDER: "${MESH_COMPOSE_GOOSE_FALLBACK_PROVIDER:-}"
      GOOSE_FALLBACK_MODEL: "${MESH_COMPOSE_GOOSE_FALLBACK_MODEL:-MiniMax-M2.5}"
      GOOSE_PRIMARY_TIMEOUT_SECONDS: "${GOOSE_PRIMARY_TIMEOUT_SECONDS:-60}"
      GOOSE_OLLAMA_TIMEOUT_SECONDS: "${GOOSE_OLLAMA_TIMEOUT_SECONDS:-45}"
      GOOSE_FALLBACK_TIMEOUT_SECONDS: "${GOOSE_FALLBACK_TIMEOUT_SECONDS:-90}"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-https://api.minimax.io/v1}"
      OPENAI_HOST: "${OPENAI_HOST:-https://api.minimax.io/v1}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      ANTHROPIC_BASE_URL: "${ANTHROPIC_BASE_URL:-}"
      ANTHROPIC_HOST: "${ANTHROPIC_HOST:-}"
      GOOGLE_API_KEY: "${GOOGLE_API_KEY:-}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      OLLAMA_HOST: "${MESH_COMPOSE_OLLAMA_HOST:-}"
      KUBECONFIG: /root/.kube/config
      MESH_KUBECTL_COMMAND: "${MESH_KUBECTL_COMMAND:-kubectl}"
      MESH_KUBERNETES_ALLOWED_CONTEXTS: "${MESH_KUBERNETES_ALLOWED_CONTEXTS:-k3d-mesh-e2e}"
      MESH_AGENT_FABRIC_MODE: "${MESH_AGENT_FABRIC_MODE:-native}"
      MESH_CENTAUR_ENDPOINT: "${MESH_CENTAUR_ENDPOINT:-http://mesh-centaur-adapter:8080}"
      MESH_CENTAUR_API_KEY_ENV_NAME: "${MESH_CENTAUR_API_KEY_ENV_NAME:-MESH_CENTAUR_ADAPTER_API_KEY}"
      MESH_CENTAUR_ADAPTER_API_KEY: "${MESH_CENTAUR_ADAPTER_API_KEY:-local-compose-centaur-key}"
      MESH_CENTAUR_CREDENTIAL_EGRESS_POLICY_PATH: "${MESH_CENTAUR_CREDENTIAL_EGRESS_POLICY_PATH:-/app/config/centaur-credential-egress.local.json}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - mesh_runtime_state:/app/.mesh-runtime-state
      - hermes_home:/workspace/orbital-mesh/.hermes-local
      - goose_config:/root/.config/goose
      - ./:/workspace/orbital-mesh
      - ${MESH_KUBECONFIG_HOST_PATH:-${HOME}/.kube/config}:/root/.kube/config:ro
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/api/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  mesh-centaur-adapter:
    profiles:
      - centaur-sandbox
    build: .
    init: true
    command: ["python3", "-m", "services.orchestrator.centaur_runtime_adapter"]
    environment:
      MESH_CENTAUR_ADAPTER_HOST: "0.0.0.0"
      MESH_CENTAUR_ADAPTER_PORT: "8080"
      MESH_CENTAUR_ADAPTER_STATE_DIR: /app/.mesh-centaur-adapter
      MESH_CENTAUR_API_KEY_ENV_NAME: "${MESH_CENTAUR_API_KEY_ENV_NAME:-MESH_CENTAUR_ADAPTER_API_KEY}"
      MESH_CENTAUR_ADAPTER_API_KEY: "${MESH_CENTAUR_ADAPTER_API_KEY:-local-compose-centaur-key}"
    volumes:
      - mesh_centaur_adapter_state:/app/.mesh-centaur-adapter
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  mesh-centaur-credential-proxy:
    profiles:
      - centaur-sandbox
    build: .
    init: true
    command: ["python3", "-m", "http.server", "15001", "--bind", "0.0.0.0"]
    environment:
      MESH_CREDENTIAL_PLACEHOLDER_MODE: "true"
      MESH_CREDENTIAL_POLICY_REF: mesh.credential_egress_policy.v1
      MESH_CREDENTIAL_ALLOWED_HOSTS: "mesh-centaur-adapter,127.0.0.1,localhost"
      CENTAUR_API_KEY: "$${secret:CENTAUR_API_KEY}"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:15001', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  hermes_home:
  mesh_runtime_state:
  goose_config:
  mesh_centaur_adapter_state:
