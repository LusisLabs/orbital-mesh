services:
  mesh:
    build: .
    init: true
    ports:
      - "${MESH_PUBLISH_PORT:-8787}:8787"
    environment:
      MESH_SERVER_HOST: "${MESH_SERVER_HOST:-0.0.0.0}"
      MESH_SERVER_PORT: "${MESH_SERVER_PORT:-8787}"
      MESH_ENVIRONMENT: "${MESH_ENVIRONMENT:-production}"
      MESH_WEB_ASSET_PATH: /app/web/dist
      MESH_STATE_DIRECTORY: /app/.mesh-runtime-state
      MESH_RESEARCH_DIRECTORY: "${MESH_RESEARCH_DIRECTORY:-/app/.mesh-runtime-state/research}"
      MESH_VAULT_PATH: /app/.mesh-runtime-state/vault
      MESH_INTEGRATIONS_CONFIG_PATH: /app/.mesh-runtime-state/integrations.json
      MESH_PROMPTFOO_COMMAND: "${MESH_PROMPTFOO_COMMAND:-promptfoo}"
      MESH_GOOSE_COMMAND: "${MESH_GOOSE_COMMAND:-goose}"
      MESH_GOOSE_COMMAND_TIMEOUT_SECONDS: "${MESH_GOOSE_COMMAND_TIMEOUT_SECONDS:-180}"
      MESH_GITNEXUS_DISABLE_AUTOSTART: "1"
      MESH_GITNEXUS_SIDECAR_URL: "${MESH_GITNEXUS_SIDECAR_URL:-http://host.docker.internal:4747}"
      MESH_ACCESS_LOG: "${MESH_ACCESS_LOG:-1}"
      MESH_STRUCTURED_LOGS: "${MESH_STRUCTURED_LOGS:-1}"
      MESH_SECURITY_HEADERS: "${MESH_SECURITY_HEADERS:-true}"
      MESH_MAX_JSON_BODY_BYTES: "${MESH_MAX_JSON_BODY_BYTES:-1048576}"
      MESH_VAULT_AI_POSTPROCESS_ENABLED: "${MESH_VAULT_AI_POSTPROCESS_ENABLED:-0}"
      HERMES_INFERENCE_PROVIDER: "${HERMES_INFERENCE_PROVIDER:-}"
      HERMES_MODEL: "${HERMES_MODEL:-}"
      LLM_MODEL: "${LLM_MODEL:-}"
      GOOSE_PROVIDER: "${GOOSE_PROVIDER:-}"
      GOOSE_MODEL: "${GOOSE_MODEL:-}"
      GOOSE_FALLBACK_PROVIDER: "${GOOSE_FALLBACK_PROVIDER:-}"
      GOOSE_FALLBACK_MODEL: "${GOOSE_FALLBACK_MODEL:-}"
      GOOSE_PRIMARY_TIMEOUT_SECONDS: "${GOOSE_PRIMARY_TIMEOUT_SECONDS:-60}"
      GOOSE_OLLAMA_TIMEOUT_SECONDS: "${GOOSE_OLLAMA_TIMEOUT_SECONDS:-45}"
      GOOSE_FALLBACK_TIMEOUT_SECONDS: "${GOOSE_FALLBACK_TIMEOUT_SECONDS:-90}"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-}"
      OPENAI_HOST: "${OPENAI_HOST:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      ANTHROPIC_BASE_URL: "${ANTHROPIC_BASE_URL:-}"
      ANTHROPIC_HOST: "${ANTHROPIC_HOST:-}"
      GOOGLE_API_KEY: "${GOOGLE_API_KEY:-}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      OLLAMA_HOST: "${OLLAMA_HOST:-http://host.docker.internal:11434}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - mesh_runtime_state:/app/.mesh-runtime-state
      - goose_config:/root/.config/goose
      - ./:/workspace/mesh-intelligence
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/api/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  mesh_runtime_state:
  goose_config:
