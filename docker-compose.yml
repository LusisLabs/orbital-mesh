services:
  gitnexus:
    build:
      context: .
      dockerfile: Dockerfile.gitnexus
    ports:
      - "${GITNEXUS_PUBLISH_PORT:-4747}:4747"
    volumes:
      - gitnexus_home:/root/.gitnexus
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4747/api/info').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s

  mesh:
    build: .
    depends_on:
      gitnexus:
        condition: service_healthy
    ports:
      - "${MESH_PUBLISH_PORT:-8787}:8787"
    environment:
      MESH_SERVER_HOST: 0.0.0.0
      MESH_SERVER_PORT: "8787"
      MESH_ENVIRONMENT: production
      MESH_WEB_ASSET_PATH: /app/web/dist
      MESH_GITNEXUS_DISABLE_AUTOSTART: "1"
      MESH_GITNEXUS_SIDECAR_URL: http://gitnexus:4747
      MESH_ACCESS_LOG: "${MESH_ACCESS_LOG:-1}"
      MESH_SECURITY_HEADERS: "${MESH_SECURITY_HEADERS:-true}"
      MESH_MAX_JSON_BODY_BYTES: "${MESH_MAX_JSON_BODY_BYTES:-1048576}"
    volumes:
      - mesh_runtime_state:/app/.mesh-runtime-state
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/api/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  mesh_runtime_state:
  gitnexus_home:
