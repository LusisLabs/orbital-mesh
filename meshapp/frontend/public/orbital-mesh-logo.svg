<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 200 200">
  <title id="title">Orbital Mesh mark</title>
  <desc id="desc">A bounded orbital mesh with six infrastructure nodes around a central policy gate.</desc>
  <defs>
