    <path d="M100 58 136 79 136 121 100 142 64 121 64 79Z" stroke="#2AACB8" stroke-opacity="0.44" stroke-width="1.5"/>
    <path d="M100 34v48M157 67l-42 24M157 133l-42-24M100 166v-48M43 133l42-24M43 67l42 24" stroke="#548AF7" stroke-opacity="0.26" stroke-width="1.25"/>
  </g>

  <g fill="#181A1F" stroke="#548AF7" stroke-width="3">
