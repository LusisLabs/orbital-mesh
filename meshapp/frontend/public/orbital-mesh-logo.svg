    <path d="M169 93.5a72 72 0 0 1-27.6 63.6" stroke="url(#mesh-blue)" stroke-width="3" opacity="0.84"/>
    <path d="M115 170.4a72 72 0 0 1-70.5-26.3" stroke="url(#mesh-blue)" stroke-width="3" opacity="0.72"/>

