      <stop offset="0" stop-color="#6D9CFF"/>
      <stop offset="1" stop-color="#548AF7"/>
    </linearGradient>
    <linearGradient id="mesh-core" x1="75" y1="74" x2="125" y2="126" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#232A35"/>
      <stop offset="1" stop-color="#141820"/>
