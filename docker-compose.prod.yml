services:
  mesh:
    build:
      context: .
      args:
        MESH_BUILD_VERSION: "${MESH_BUILD_VERSION:-dev}"
        MESH_BUILD_COMMIT: "${MESH_BUILD_COMMIT:-unknown}"
        HERMES_AGENT_REF: "${HERMES_AGENT_REF:-1525624904159e7c2d6ac3feef951e27ad0d23bb}"
        UV_VERSION: "${UV_VERSION:-0.11.6}"
        GOOSE_VERSION: "${GOOSE_VERSION:-v1.30.0}"
    image: "${MESH_IMAGE:-orbital-mesh:${MESH_BUILD_VERSION:-dev}}"
    init: true
    ports:
      - "${MESH_PUBLISH_HOST:-127.0.0.1}:${MESH_PUBLISH_PORT:-8787}:8787"
    environment:
      MESH_SERVER_HOST: "${MESH_SERVER_HOST:-0.0.0.0}"
      MESH_SERVER_PORT: "${MESH_SERVER_PORT:-8787}"
      MESH_ENVIRONMENT: "${MESH_ENVIRONMENT:-production}"
      MESH_READINESS_PROFILE: "${MESH_READINESS_PROFILE:-pilot}"
      MESH_STATE_BACKEND: "${MESH_STATE_BACKEND:-postgres}"
      MESH_DATABASE_URL: "${MESH_DATABASE_URL:?set Postgres database URL for production state}"
      MESH_OPERATOR_IDENTITY_REQUIRED: "${MESH_OPERATOR_IDENTITY_REQUIRED:-1}"
      MESH_FORCE_APPROVAL_GATE: "${MESH_FORCE_APPROVAL_GATE:-1}"
      MESH_TENANT_ACTIVE_RUN_QUOTA: "${MESH_TENANT_ACTIVE_RUN_QUOTA:-4}"
      MESH_WEB_ASSET_PATH: /app/web/dist
      MESH_STATE_DIRECTORY: /app/.mesh-runtime-state
      HERMES_HOME: /workspace/orbital-mesh/.hermes-local
      MESH_RESEARCH_DIRECTORY: /app/.mesh-runtime-state/research
      MESH_VAULT_PATH: /app/.mesh-runtime-state/vault
      MESH_INTEGRATIONS_CONFIG_PATH: /app/.mesh-runtime-state/integrations.json
      MESH_OWNERSHIP_REGISTRY_PATH: "${MESH_OWNERSHIP_REGISTRY_PATH:-/app/config/ownership.registry.json}"
      MESH_CONNECTOR_CERTIFICATION_REGISTRY_PATH: "${MESH_CONNECTOR_CERTIFICATION_REGISTRY_PATH:-/app/config/connector-certification.registry.json}"
      MESH_POLICY_LIFECYCLE_MANIFEST_PATH: "${MESH_POLICY_LIFECYCLE_MANIFEST_PATH:-/app/config/policy-lifecycle.manifest.json}"
      MESH_FAILURE_MODE_LIBRARY_PATH: "${MESH_FAILURE_MODE_LIBRARY_PATH:-/app/config/failure-mode.library.json}"
      MESH_THREAT_MODEL_REGISTER_PATH: "${MESH_THREAT_MODEL_REGISTER_PATH:-/app/config/threat-model.register.json}"
      MESH_DATA_CLASSIFICATION_POLICY_PATH: "${MESH_DATA_CLASSIFICATION_POLICY_PATH:-/app/config/data-classification.policy.json}"
      MESH_AGENTIC_OPERATOR_SOURCE_PROVENANCE_PATH: "${MESH_AGENTIC_OPERATOR_SOURCE_PROVENANCE_PATH:-/app/config/agentic-operator-source.provenance.json}"
      MESH_RELEASE_PROVENANCE_PATH: "${MESH_RELEASE_PROVENANCE_PATH:?set complete release provenance packet path}"
      MESH_AUDIT_SINK_PROOF_PATH: "${MESH_AUDIT_SINK_PROOF_PATH:-}"
      MESH_BACKUP_RESTORE_REHEARSAL_PATH: "${MESH_BACKUP_RESTORE_REHEARSAL_PATH:?set backup and restore rehearsal proof path}"
      MESH_MIGRATION_REHEARSAL_PATH: "${MESH_MIGRATION_REHEARSAL_PATH:?set Postgres migration rehearsal proof path}"
      MESH_ON_CALL_DRILL_PATH: "${MESH_ON_CALL_DRILL_PATH:?set production on-call drill proof path}"
      MESH_POLICY_SIGNING_KEY: "${MESH_POLICY_SIGNING_KEY:?inject policy lifecycle signing key through your platform secret store}"
      MESH_POLICY_SIGNING_KEY_ID: "${MESH_POLICY_SIGNING_KEY_ID:-policy-lifecycle-hmac}"
      MESH_PROMPTFOO_COMMAND: "${MESH_PROMPTFOO_COMMAND:-promptfoo}"
      MESH_GOOSE_COMMAND: "${MESH_GOOSE_COMMAND:-goose}"
      MESH_GOOSE_COMMAND_TIMEOUT_SECONDS: "${MESH_GOOSE_COMMAND_TIMEOUT_SECONDS:-180}"
      MESH_GOOSE_RUN_TIMEOUT_SECONDS: "${MESH_GOOSE_RUN_TIMEOUT_SECONDS:-180}"
      MESH_EVO_COMMAND: "${MESH_EVO_COMMAND:-}"
      MESH_EVO_COMMAND_TIMEOUT_SECONDS: "${MESH_EVO_COMMAND_TIMEOUT_SECONDS:-60}"
      MESH_HERMES_COMMAND: "${MESH_HERMES_COMMAND:-hermes}"
      MESH_HERMES_COMMAND_TIMEOUT_SECONDS: "${MESH_HERMES_COMMAND_TIMEOUT_SECONDS:-180}"
      MESH_ACCESS_LOG: "${MESH_ACCESS_LOG:-1}"
      MESH_STRUCTURED_LOGS: "${MESH_STRUCTURED_LOGS:-1}"
      MESH_SECURITY_HEADERS: "${MESH_SECURITY_HEADERS:-true}"
      MESH_LIVE_FEEDBACK_REQUIRED: "${MESH_LIVE_FEEDBACK_REQUIRED:-1}"
      MESH_FEEDBACK_PROMETHEUS_ENABLED: "${MESH_FEEDBACK_PROMETHEUS_ENABLED:-1}"
      MESH_PROMETHEUS_URL: "${MESH_PROMETHEUS_URL:?set production Prometheus URL for feedback and telemetry}"
      MESH_BRAIN_ARTIFACT_URI_PREFIX: "${MESH_BRAIN_ARTIFACT_URI_PREFIX:?set durable object-storage URI prefix for Mesh Brain artifacts}"
      MESH_BRAIN_SERVING_BASE_URL: "${MESH_BRAIN_SERVING_BASE_URL:?set OpenAI-compatible Mesh Brain serving backend URL}"
      MESH_BRAIN_SERVING_MODEL: "${MESH_BRAIN_SERVING_MODEL:?set Mesh Brain serving model name}"
      MESH_FEATURE_FLAG_CREDENTIALS_AVAILABLE: "${MESH_FEATURE_FLAG_CREDENTIALS_AVAILABLE:-false}"
      MESH_INCIDENT_CREDENTIALS_AVAILABLE: "${MESH_INCIDENT_CREDENTIALS_AVAILABLE:-false}"
      MESH_MAX_JSON_BODY_BYTES: "${MESH_MAX_JSON_BODY_BYTES:-1048576}"
      MESH_VAULT_AI_POSTPROCESS_ENABLED: "${MESH_VAULT_AI_POSTPROCESS_ENABLED:-0}"
      MESH_BUILD_VERSION: "${MESH_BUILD_VERSION:-dev}"
      MESH_BUILD_COMMIT: "${MESH_BUILD_COMMIT:-unknown}"
      KUBECONFIG: /run/secrets/mesh-kubeconfig
      MESH_KUBERNETES_LIVE_EXECUTION_ENABLED: "${MESH_KUBERNETES_LIVE_EXECUTION_ENABLED:-1}"
      MESH_KUBECTL_COMMAND: "${MESH_KUBECTL_COMMAND:-kubectl}"
      MESH_KUBERNETES_ROLLOUT_TIMEOUT_SECONDS: "${MESH_KUBERNETES_ROLLOUT_TIMEOUT_SECONDS:-120}"
      MESH_KUBERNETES_ALLOWED_CONTEXTS: "${MESH_KUBERNETES_ALLOWED_CONTEXTS:?set allowed Kubernetes contexts}"
      MESH_KUBERNETES_ALLOWED_NAMESPACES: "${MESH_KUBERNETES_ALLOWED_NAMESPACES:?set allowed Kubernetes namespaces}"
      GOOSE_PROVIDER: "${GOOSE_PROVIDER:-openai}"
      GOOSE_MODEL: "${GOOSE_MODEL:-MiniMax-M2.5}"
      GOOSE_PRIMARY_TIMEOUT_SECONDS: "${GOOSE_PRIMARY_TIMEOUT_SECONDS:-180}"
      GOOSE_OLLAMA_TIMEOUT_SECONDS: "${GOOSE_OLLAMA_TIMEOUT_SECONDS:-180}"
      GOOSE_FALLBACK_TIMEOUT_SECONDS: "${GOOSE_FALLBACK_TIMEOUT_SECONDS:-180}"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-https://api.minimax.io/v1}"
      OPENAI_HOST: "${OPENAI_HOST:-https://api.minimax.io/v1}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:?inject OPENAI_API_KEY through your platform secret store}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      ANTHROPIC_BASE_URL: "${ANTHROPIC_BASE_URL:-}"
      ANTHROPIC_HOST: "${ANTHROPIC_HOST:-}"
      GOOGLE_API_KEY: "${GOOGLE_API_KEY:-}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
    volumes:
      - mesh_runtime_state:/app/.mesh-runtime-state
      - hermes_home:/workspace/orbital-mesh/.hermes-local
      - goose_config:/root/.config/goose
      - "${MESH_KUBECONFIG_HOST_PATH:?set host kubeconfig path}:/run/secrets/mesh-kubeconfig:ro"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /run
      - /root/.cache
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/api/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  mesh_runtime_state:
  hermes_home:
  goose_config:
