services:
  k3s:
    image: "${MESH_K3S_IMAGE:-rancher/k3s:v1.31.5-k3s1}"
    container_name: orbital-mesh-k3s
    privileged: true
    command:
      - server
      - --disable=traefik
      - --disable=servicelb
      - --https-listen-port=6443
      - --node-name=${MESH_K3S_NODE_NAME:-mesh-compose-k3s}
      - --tls-san=k3s
      - --tls-san=host.docker.internal
    environment:
      K3S_KUBECONFIG_OUTPUT: /output/kubeconfig
      K3S_KUBECONFIG_MODE: "666"
    tmpfs:
      - /run
      - /var/run
    volumes:
      - k3s_server_data:/var/lib/rancher/k3s
      - mesh_kubeconfig:/output
    ports:
      - "${MESH_K3S_API_PUBLISH_PORT:-6443}:6443"
    healthcheck:
      test: ["CMD-SHELL", "kubectl get nodes >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  k3s-vm:
    image: "${MESH_K3S_IMAGE:-rancher/k3s:v1.31.5-k3s1}"
    container_name: orbital-mesh-k3s-vm
    privileged: true
    command:
      - server
      - --disable=traefik
      - --disable=servicelb
      - --https-listen-port=6443
      - --node-name=${MESH_K3S_VM_NODE_NAME:-mesh-compose-vm-k3s}
      - --tls-san=k3s-vm
      - --tls-san=host.docker.internal
    environment:
      K3S_KUBECONFIG_OUTPUT: /output/kubeconfig
      K3S_KUBECONFIG_MODE: "666"
    tmpfs:
      - /run
      - /var/run
    volumes:
      - k3s_vm_server_data:/var/lib/rancher/k3s
      - mesh_kubeconfig_vm:/output
    healthcheck:
      test: ["CMD-SHELL", "kubectl get nodes >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  k3s-baremetal:
    image: "${MESH_K3S_IMAGE:-rancher/k3s:v1.31.5-k3s1}"
    container_name: orbital-mesh-k3s-baremetal
    privileged: true
    command:
      - server
      - --disable=traefik
      - --disable=servicelb
      - --https-listen-port=6443
      - --node-name=${MESH_K3S_BAREMETAL_NODE_NAME:-mesh-compose-baremetal-k3s}
      - --tls-san=k3s-baremetal
      - --tls-san=host.docker.internal
    environment:
      K3S_KUBECONFIG_OUTPUT: /output/kubeconfig
      K3S_KUBECONFIG_MODE: "666"
    tmpfs:
      - /run
      - /var/run
    volumes:
      - k3s_baremetal_server_data:/var/lib/rancher/k3s
      - mesh_kubeconfig_baremetal:/output
    healthcheck:
      test: ["CMD-SHELL", "kubectl get nodes >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  postgres:
    image: "${MESH_POSTGRES_IMAGE:-postgres:16-alpine}"
    container_name: orbital-mesh-postgres
    environment:
      POSTGRES_DB: "${MESH_POSTGRES_DB:-mesh}"
      POSTGRES_USER: "${MESH_POSTGRES_USER:-mesh}"
      POSTGRES_PASSWORD: "${MESH_POSTGRES_PASSWORD:-mesh}"
    ports:
      - "${MESH_POSTGRES_PUBLISH_PORT:-5432}:5432"
    volumes:
      - mesh_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  rpc-gateway:
    image: "${MESH_BUSYBOX_IMAGE:-busybox:1.36}"
    container_name: orbital-mesh-rpc-gateway
    command:
      - sh
      - -c
      - |
        mkdir -p /www
        cat > /www/health <<'EOF'
        {"status":"ok","component_kind":"rpc_gateway","baseline_value":1.0,"observed_value":1.0,"delta_pct":0.0,"threshold_pct":30.0}
        EOF
        exec httpd -f -p 8080 -h /www
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health | grep -q '\"status\":\"ok\"'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  indexer:
    image: "${MESH_BUSYBOX_IMAGE:-busybox:1.36}"
    container_name: orbital-mesh-indexer
    command:
      - sh
      - -c
      - |
        mkdir -p /www
        cat > /www/health <<'EOF'
        {"status":"ok","component_kind":"indexer","baseline_value":1.0,"observed_value":1.0,"delta_pct":0.0,"threshold_pct":30.0}
        EOF
        exec httpd -f -p 8080 -h /www
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health | grep -q '\"status\":\"ok\"'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  hermes:
    build:
      context: .
      dockerfile: Dockerfile.stack.hermes
      args:
        HERMES_AGENT_REF: "${HERMES_AGENT_REF:-1525624904159e7c2d6ac3feef951e27ad0d23bb}"
        UV_VERSION: "${UV_VERSION:-0.11.6}"
    image: "${HERMES_RUNTIME_IMAGE:-orbital-mesh-hermes:${MESH_BUILD_VERSION:-dev}}"
    container_name: orbital-mesh-hermes-stack
    working_dir: /workspace/orbital-mesh
    command:
      - sh
      - -lc
      - |
        mkdir -p "$${HERMES_HOME}/cron" "$${HERMES_HOME}/sessions" "$${HERMES_HOME}/logs" "$${HERMES_HOME}/memories" "$${HERMES_HOME}/skills";
        cat > "$${HERMES_HOME}/config.yaml" <<EOF
        model:
          default: "$${HERMES_MODEL:-MiniMax-M2.7}"
          provider: "custom"
          base_url: "$${OPENAI_BASE_URL:-https://api.minimax.io/v1}"
        terminal:
          backend: "local"
          cwd: "."
          timeout: 180
          docker_mount_cwd_to_workspace: false
          lifetime_seconds: 300
          container_cpu: 1
          container_memory: 5120
          container_disk: 51200
          container_persistent: true
        EOF
        touch "$${HERMES_HOME}/.env";
        exec sleep infinity
    environment:
      HERMES_HOME: /workspace/orbital-mesh/.hermes-local
      HERMES_INFERENCE_PROVIDER: "${MESH_COMPOSE_HERMES_INFERENCE_PROVIDER:-openai}"
      HERMES_MODEL: "${MESH_COMPOSE_HERMES_MODEL:-MiniMax-M2.7}"
      LLM_MODEL: "${MESH_COMPOSE_LLM_MODEL:-MiniMax-M2.7}"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-https://api.minimax.io/v1}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      ANTHROPIC_BASE_URL: "${ANTHROPIC_BASE_URL:-}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      GOOGLE_API_KEY: "${GOOGLE_API_KEY:-}"
    volumes:
      - ./:/workspace/orbital-mesh
      - hermes_home:/workspace/orbital-mesh/.hermes-local
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/opt/venv/bin/hermes", "version"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 20s

  mesh-kube-bootstrap:
    build:
      context: .
      args:
        MESH_BUILD_VERSION: "${MESH_BUILD_VERSION:-dev}"
        MESH_BUILD_COMMIT: "${MESH_BUILD_COMMIT:-unknown}"
        HERMES_AGENT_REF: "${HERMES_AGENT_REF:-1525624904159e7c2d6ac3feef951e27ad0d23bb}"
        UV_VERSION: "${UV_VERSION:-0.11.6}"
        GOOSE_VERSION: "${GOOSE_VERSION:-v1.30.0}"
    image: "${MESH_STACK_IMAGE:-orbital-mesh-stack:${MESH_BUILD_VERSION:-dev}}"
    container_name: orbital-mesh-kube-bootstrap
    # Same image defaults to USER mesh; k3s writes kubeconfig as root on this volume, so kubectl
    # cannot create kubeconfig.lock unless we run this one-shot bootstrap as root.
    user: "0:0"
    depends_on:
      k3s:
        condition: service_healthy
    environment:
      KUBECONFIG: /mesh-kubeconfig/kubeconfig
      MESH_STACK_KUBE_CONTEXT: "${MESH_STACK_KUBE_CONTEXT:-mesh-compose}"
      MESH_STACK_NAMESPACE: "${MESH_STACK_NAMESPACE:-search}"
      MESH_STACK_DEPLOYMENT: "${MESH_STACK_DEPLOYMENT:-semantic-search}"
      MESH_STACK_K3S_URL: "https://k3s:6443"
      MESH_STACK_NODE_NAME: "${MESH_K3S_NODE_NAME:-mesh-compose-k3s}"
    command:
      - sh
      - -lc
      - /workspace/orbital-mesh/scripts/compose_kube_bootstrap.sh
    volumes:
      - ./:/workspace/orbital-mesh
      - mesh_kubeconfig:/mesh-kubeconfig
    restart: "no"

  mesh-kube-bootstrap-vm:
    build:
      context: .
      args:
        MESH_BUILD_VERSION: "${MESH_BUILD_VERSION:-dev}"
        MESH_BUILD_COMMIT: "${MESH_BUILD_COMMIT:-unknown}"
        HERMES_AGENT_REF: "${HERMES_AGENT_REF:-1525624904159e7c2d6ac3feef951e27ad0d23bb}"
        UV_VERSION: "${UV_VERSION:-0.11.6}"
        GOOSE_VERSION: "${GOOSE_VERSION:-v1.30.0}"
    image: "${MESH_STACK_IMAGE:-orbital-mesh-stack:${MESH_BUILD_VERSION:-dev}}"
    container_name: orbital-mesh-kube-bootstrap-vm
    user: "0:0"
    depends_on:
      k3s-vm:
        condition: service_healthy
    environment:
      KUBECONFIG: /mesh-kubeconfig-vm/kubeconfig
      MESH_STACK_KUBE_CONTEXT: "${MESH_STACK_VM_KUBE_CONTEXT:-mesh-compose-vm}"
      MESH_STACK_NAMESPACE: "${MESH_STACK_VM_NAMESPACE:-search}"
      MESH_STACK_DEPLOYMENT: "${MESH_STACK_VM_DEPLOYMENT:-semantic-search}"
      MESH_STACK_K3S_URL: "https://k3s-vm:6443"
      MESH_STACK_NODE_NAME: "${MESH_K3S_VM_NODE_NAME:-mesh-compose-vm-k3s}"
    command:
      - sh
      - -lc
      - /workspace/orbital-mesh/scripts/compose_kube_bootstrap.sh
    volumes:
      - ./:/workspace/orbital-mesh
      - mesh_kubeconfig_vm:/mesh-kubeconfig-vm
    restart: "no"

  mesh-kube-bootstrap-baremetal:
    build:
      context: .
      args:
        MESH_BUILD_VERSION: "${MESH_BUILD_VERSION:-dev}"
        MESH_BUILD_COMMIT: "${MESH_BUILD_COMMIT:-unknown}"
        HERMES_AGENT_REF: "${HERMES_AGENT_REF:-1525624904159e7c2d6ac3feef951e27ad0d23bb}"
        UV_VERSION: "${UV_VERSION:-0.11.6}"
        GOOSE_VERSION: "${GOOSE_VERSION:-v1.30.0}"
    image: "${MESH_STACK_IMAGE:-orbital-mesh-stack:${MESH_BUILD_VERSION:-dev}}"
    container_name: orbital-mesh-kube-bootstrap-baremetal
    user: "0:0"
    depends_on:
      k3s-baremetal:
        condition: service_healthy
    environment:
      KUBECONFIG: /mesh-kubeconfig-baremetal/kubeconfig
      MESH_STACK_KUBE_CONTEXT: "${MESH_STACK_BAREMETAL_KUBE_CONTEXT:-mesh-compose-baremetal}"
      MESH_STACK_NAMESPACE: "${MESH_STACK_BAREMETAL_NAMESPACE:-search}"
      MESH_STACK_DEPLOYMENT: "${MESH_STACK_BAREMETAL_DEPLOYMENT:-semantic-search}"
      MESH_STACK_K3S_URL: "https://k3s-baremetal:6443"
      MESH_STACK_NODE_NAME: "${MESH_K3S_BAREMETAL_NODE_NAME:-mesh-compose-baremetal-k3s}"
    command:
      - sh
      - -lc
      - /workspace/orbital-mesh/scripts/compose_kube_bootstrap.sh
    volumes:
      - ./:/workspace/orbital-mesh
      - mesh_kubeconfig_baremetal:/mesh-kubeconfig-baremetal
    restart: "no"

  mesh:
    build:
      context: .
      args:
        MESH_BUILD_VERSION: "${MESH_BUILD_VERSION:-dev}"
        MESH_BUILD_COMMIT: "${MESH_BUILD_COMMIT:-unknown}"
        HERMES_AGENT_REF: "${HERMES_AGENT_REF:-1525624904159e7c2d6ac3feef951e27ad0d23bb}"
        UV_VERSION: "${UV_VERSION:-0.11.6}"
        GOOSE_VERSION: "${GOOSE_VERSION:-v1.30.0}"
    image: "${MESH_STACK_IMAGE:-orbital-mesh-stack:${MESH_BUILD_VERSION:-dev}}"
    container_name: orbital-mesh-stack
    init: true
    depends_on:
      hermes:
        condition: service_healthy
      mesh-kube-bootstrap:
        condition: service_completed_successfully
      mesh-kube-bootstrap-vm:
        condition: service_completed_successfully
      mesh-kube-bootstrap-baremetal:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      latentmas:
        condition: service_healthy
    ports:
      - "${MESH_PUBLISH_PORT:-8787}:8787"
    environment:
      MESH_SERVER_HOST: "${MESH_SERVER_HOST:-0.0.0.0}"
      MESH_SERVER_PORT: "${MESH_SERVER_PORT:-8787}"
      MESH_ENVIRONMENT: "${MESH_ENVIRONMENT:-production}"
      MESH_STATE_BACKEND: "${MESH_STATE_BACKEND:-postgres}"
      MESH_DATABASE_URL: "${MESH_DATABASE_URL:-postgresql://mesh:mesh@postgres:5432/mesh}"
      MESH_DEFAULT_STEERING_MODE: "${MESH_DEFAULT_STEERING_MODE:-approval_gate}"
      MESH_OPERATOR_IDENTITY_REQUIRED: "${MESH_OPERATOR_IDENTITY_REQUIRED:-1}"
      MESH_FEATURE_FLAG_CREDENTIALS_AVAILABLE: "${MESH_FEATURE_FLAG_CREDENTIALS_AVAILABLE:-false}"
      MESH_INCIDENT_CREDENTIALS_AVAILABLE: "${MESH_INCIDENT_CREDENTIALS_AVAILABLE:-false}"
      MESH_WEB_ASSET_PATH: /app/web/dist
      MESH_STATE_DIRECTORY: /app/.mesh-runtime-state
      MESH_RESEARCH_DIRECTORY: /app/.mesh-runtime-state/research
      MESH_VAULT_PATH: /app/.mesh-runtime-state/vault
      MESH_INTEGRATIONS_CONFIG_PATH: /app/.mesh-runtime-state/integrations.json
      MESH_READINESS_PROBE_TIMEOUT_SECONDS: "${MESH_READINESS_PROBE_TIMEOUT_SECONDS:-15}"
      MESH_PROMPTFOO_COMMAND: "${MESH_PROMPTFOO_COMMAND:-promptfoo}"
      MESH_HERMES_COMMAND: "${MESH_STACK_HERMES_EXEC_COMMAND:-docker exec -w /workspace/orbital-mesh -e HERMES_HOME=/workspace/orbital-mesh/.hermes-local orbital-mesh-hermes-stack /opt/venv/bin/hermes}"
      MESH_HERMES_COMMAND_TIMEOUT_SECONDS: "${MESH_HERMES_COMMAND_TIMEOUT_SECONDS:-180}"
      MESH_GOOSE_COMMAND: "${MESH_GOOSE_COMMAND:-goose}"
      MESH_GOOSE_COMMAND_TIMEOUT_SECONDS: "${MESH_GOOSE_COMMAND_TIMEOUT_SECONDS:-180}"
      MESH_EVO_COMMAND: "${MESH_EVO_COMMAND:-}"
      MESH_EVO_COMMAND_TIMEOUT_SECONDS: "${MESH_EVO_COMMAND_TIMEOUT_SECONDS:-60}"
      MESH_EVAL_CONTEXT_TOKEN_BUDGET: "${MESH_EVAL_CONTEXT_TOKEN_BUDGET:-2048}"
      MESH_EVAL_TOKENIZER_JSON: "${MESH_EVAL_TOKENIZER_JSON:-}"
      MESH_EVAL_SENTENCEPIECE_MODEL: "${MESH_EVAL_SENTENCEPIECE_MODEL:-}"
      MESH_EVAL_LATENTMAS_CRATE: "${MESH_EVAL_LATENTMAS_CRATE:-latent-mesh/LatentMAS}"
      MESH_EVAL_LATENTMAS_COMMAND: "${MESH_EVAL_LATENTMAS_COMMAND:-latentmas}"
      MESH_EVAL_LATENTMAS_TIMEOUT_SECONDS: "${MESH_EVAL_LATENTMAS_TIMEOUT_SECONDS:-30}"
      DOCKER_HOST: unix:///var/run/docker.sock
      MESH_GITNEXUS_DISABLE_AUTOSTART: "1"
      MESH_GITNEXUS_SIDECAR_URL: "${MESH_STACK_GITNEXUS_URL:-}"
      MESH_ACCESS_LOG: "${MESH_ACCESS_LOG:-1}"
      MESH_STRUCTURED_LOGS: "${MESH_STRUCTURED_LOGS:-1}"
      MESH_SECURITY_HEADERS: "${MESH_SECURITY_HEADERS:-true}"
      MESH_MAX_JSON_BODY_BYTES: "${MESH_MAX_JSON_BODY_BYTES:-1048576}"
      MESH_VAULT_AI_POSTPROCESS_ENABLED: "${MESH_VAULT_AI_POSTPROCESS_ENABLED:-0}"
      MESH_AGENT_FABRIC_MODE: "${MESH_STACK_AGENT_FABRIC_MODE:-deepagents}"
      MESH_DEEPAGENTS_MODEL: "${MESH_DEEPAGENTS_MODEL:-openai:MiniMax-M2.7}"
      MESH_DEEPAGENTS_TIMEOUT_SECONDS: "${MESH_DEEPAGENTS_TIMEOUT_SECONDS:-120}"
      MESH_DEEPAGENTS_WORKSPACE_ROOT: /app/.mesh-runtime-state/deepagents
      MESH_DEEPAGENTS_MAX_ARTIFACT_CHARS: "${MESH_DEEPAGENTS_MAX_ARTIFACT_CHARS:-20000}"
      MESH_AGENT_TASK_TIMEOUT_SECONDS: "${MESH_AGENT_TASK_TIMEOUT_SECONDS:-180}"
      MESH_REASONING_BANK_ENABLED: "${MESH_REASONING_BANK_ENABLED:-1}"
      MESH_REASONING_BANK_MAX_STRATEGIES: "${MESH_REASONING_BANK_MAX_STRATEGIES:-8}"
      MESH_REASONING_BANK_SCALING_MODE: "${MESH_REASONING_BANK_SCALING_MODE:-sequential}"
      MESH_CORPUS_MEMORY_ENABLED: "${MESH_CORPUS_MEMORY_ENABLED:-1}"
      MESH_CORPUS_DATABASE_PATH: "${MESH_CORPUS_DATABASE_PATH:-/workspace/orbital-mesh/.mesh-runtime-state/corpus/incident_corpus.sqlite}"
      MESH_CORPUS_MEMORY_PROJECTION_LIMIT: "${MESH_CORPUS_MEMORY_PROJECTION_LIMIT:-5000}"
      MESH_VAULT_MATERIALIZE_MIN_INTERVAL_SECONDS: "${MESH_VAULT_MATERIALIZE_MIN_INTERVAL_SECONDS:-30}"
      HERMES_INFERENCE_PROVIDER: "${MESH_COMPOSE_HERMES_INFERENCE_PROVIDER:-openai}"
      HERMES_MODEL: "${MESH_COMPOSE_HERMES_MODEL:-MiniMax-M2.7}"
      LLM_MODEL: "${MESH_COMPOSE_LLM_MODEL:-MiniMax-M2.7}"
      GOOSE_PROVIDER: "${MESH_COMPOSE_GOOSE_PROVIDER:-openai}"
      GOOSE_MODEL: "${MESH_COMPOSE_GOOSE_MODEL:-MiniMax-M2.5}"
      GOOSE_FALLBACK_PROVIDER: "${MESH_COMPOSE_GOOSE_FALLBACK_PROVIDER:-}"
      GOOSE_FALLBACK_MODEL: "${MESH_COMPOSE_GOOSE_FALLBACK_MODEL:-MiniMax-M2.5}"
      GOOSE_PRIMARY_TIMEOUT_SECONDS: "${GOOSE_PRIMARY_TIMEOUT_SECONDS:-60}"
      GOOSE_OLLAMA_TIMEOUT_SECONDS: "${GOOSE_OLLAMA_TIMEOUT_SECONDS:-45}"
      GOOSE_FALLBACK_TIMEOUT_SECONDS: "${GOOSE_FALLBACK_TIMEOUT_SECONDS:-90}"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-https://api.minimax.io/v1}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      ANTHROPIC_BASE_URL: "${ANTHROPIC_BASE_URL:-}"
      GOOGLE_API_KEY: "${GOOGLE_API_KEY:-}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      OLLAMA_HOST: "${MESH_COMPOSE_OLLAMA_HOST:-}"
      KUBECONFIG: /mesh-kubeconfig/kubeconfig:/mesh-kubeconfig-vm/kubeconfig:/mesh-kubeconfig-baremetal/kubeconfig
      MESH_KUBERNETES_LIVE_EXECUTION_ENABLED: "${MESH_KUBERNETES_LIVE_EXECUTION_ENABLED:-1}"
      MESH_KUBECTL_COMMAND: "${MESH_KUBECTL_COMMAND:-kubectl}"
      MESH_KUBERNETES_ROLLOUT_TIMEOUT_SECONDS: "${MESH_KUBERNETES_ROLLOUT_TIMEOUT_SECONDS:-120}"
      MESH_KUBERNETES_ALLOWED_CONTEXTS: "${MESH_STACK_MULTI_ALLOWED_CONTEXTS:-mesh-compose,mesh-compose-vm,mesh-compose-baremetal}"
      MESH_KUBERNETES_ALLOWED_NAMESPACES: "${MESH_STACK_ALLOWED_NAMESPACES:-search}"
      MESH_LATENTMAS_ENABLED: "${MESH_STACK_ENABLE_LATENTMAS:-1}"
      MESH_LATENTMAS_URL: "${MESH_STACK_LATENTMAS_URL:-http://latentmas:8791}"
      MESH_LATENTMAS_TIMEOUT_SECONDS: "${MESH_LATENTMAS_TIMEOUT_SECONDS:-600}"
      MESH_LATENTMAS_MODEL_NAME: "${MESH_LATENTMAS_MODEL_NAME:-sshleifer/tiny-gpt2}"
      MESH_LATENTMAS_DEVICE: "${MESH_LATENTMAS_DEVICE:-cpu}"
      MESH_LATENTMAS_PROMPT_MODE: "${MESH_LATENTMAS_PROMPT_MODE:-sequential}"
      MESH_LATENTMAS_LATENT_STEPS: "${MESH_LATENTMAS_LATENT_STEPS:-10}"
      MESH_LATENTMAS_MAX_NEW_TOKENS: "${MESH_LATENTMAS_MAX_NEW_TOKENS:-1024}"
      MESH_LATENTMAS_USE_VLLM: "${MESH_LATENTMAS_USE_VLLM:-0}"
      MESH_LATENTMAS_MAX_ARTIFACT_CHARS: "${MESH_LATENTMAS_MAX_ARTIFACT_CHARS:-20000}"
      MESH_BUILD_VERSION: "${MESH_BUILD_VERSION:-dev}"
      MESH_BUILD_COMMIT: "${MESH_BUILD_COMMIT:-unknown}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - mesh_runtime_state:/app/.mesh-runtime-state
      - goose_config:/root/.config/goose
      - ./:/workspace/orbital-mesh
      - mesh_kubeconfig:/mesh-kubeconfig:ro
      - mesh_kubeconfig_vm:/mesh-kubeconfig-vm:ro
      - mesh_kubeconfig_baremetal:/mesh-kubeconfig-baremetal:ro
      - "${MESH_DOCKER_SOCKET_HOST_PATH:-/var/run/docker.sock}:/var/run/docker.sock"
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/api/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  mesh-agent-operator:
    build:
      context: .
      args:
        MESH_BUILD_VERSION: "${MESH_BUILD_VERSION:-dev}"
        MESH_BUILD_COMMIT: "${MESH_BUILD_COMMIT:-unknown}"
        HERMES_AGENT_REF: "${HERMES_AGENT_REF:-1525624904159e7c2d6ac3feef951e27ad0d23bb}"
        UV_VERSION: "${UV_VERSION:-0.11.6}"
        GOOSE_VERSION: "${GOOSE_VERSION:-v1.30.0}"
    image: "${MESH_STACK_IMAGE:-orbital-mesh-stack:${MESH_BUILD_VERSION:-dev}}"
    container_name: orbital-mesh-agent-operator
    depends_on:
      mesh:
        condition: service_healthy
    environment:
      PYTHONPATH: /workspace/orbital-mesh
      BASE_URL: "${MESH_STACK_BASE_URL:-http://mesh:8787}"
      MESH_AGENT_OPERATOR_ENABLED: "${MESH_STACK_AGENT_OPERATOR_ENABLED:-1}"
      MESH_AGENT_OPERATOR_PRIORITY: "${MESH_AGENT_OPERATOR_PRIORITY:-hermes,goose,codex,claudecode,openclaw,evo,latentmas}"
      MESH_AGENT_OPERATOR_CONFIDENCE_FLOOR: "${MESH_AGENT_OPERATOR_CONFIDENCE_FLOOR:-0.86}"
      MESH_AGENT_OPERATOR_AUTONOMY_TIER: "${MESH_AGENT_OPERATOR_AUTONOMY_TIER:-escalated}"
      MESH_AGENT_OPERATOR_EXISTING_RUN_MAX_AGE_SECONDS: "${MESH_AGENT_OPERATOR_EXISTING_RUN_MAX_AGE_SECONDS:-3600}"
      MESH_AGENT_OPERATOR_INTERVAL_SECONDS: "${MESH_AGENT_OPERATOR_INTERVAL_SECONDS:-3}"
      MESH_AGENT_OPERATOR_REQUEST_TIMEOUT_SECONDS: "${MESH_AGENT_OPERATOR_REQUEST_TIMEOUT_SECONDS:-10}"
      MESH_AGENT_OPERATOR_ID: "${MESH_AGENT_OPERATOR_ID:-mesh-agent-operator}"
      MESH_AGENT_OPERATOR_ROLES: "${MESH_AGENT_OPERATOR_ROLES:-approver}"
    command:
      - python3
      - /workspace/orbital-mesh/scripts/mesh_agent_operator.py
    volumes:
      - ./:/workspace/orbital-mesh
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      disable: true

  mesh-smoke:
    build:
      context: .
      args:
        MESH_BUILD_VERSION: "${MESH_BUILD_VERSION:-dev}"
        MESH_BUILD_COMMIT: "${MESH_BUILD_COMMIT:-unknown}"
        HERMES_AGENT_REF: "${HERMES_AGENT_REF:-1525624904159e7c2d6ac3feef951e27ad0d23bb}"
        UV_VERSION: "${UV_VERSION:-0.11.6}"
        GOOSE_VERSION: "${GOOSE_VERSION:-v1.30.0}"
    image: "${MESH_STACK_IMAGE:-orbital-mesh-stack:${MESH_BUILD_VERSION:-dev}}"
    container_name: orbital-mesh-smoke
    depends_on:
      mesh:
        condition: service_healthy
      mesh-agent-operator:
        condition: service_started
      rpc-gateway:
        condition: service_healthy
      indexer:
        condition: service_healthy
    environment:
      KUBECONFIG: /mesh-kubeconfig/kubeconfig
      BASE_URL: "${MESH_STACK_BASE_URL:-http://mesh:8787}"
      KUBE_CONTEXT: "${MESH_STACK_KUBE_CONTEXT:-mesh-compose}"
      NAMESPACE: "${MESH_STACK_NAMESPACE:-search}"
      DEPLOYMENT_NAME: "${MESH_STACK_DEPLOYMENT:-semantic-search}"
      EVALUATION_MODE: "${MESH_STACK_SMOKE_EVALUATION_MODE:-native}"
      ORCHESTRATION_MODE: "${MESH_STACK_SMOKE_ORCHESTRATION_MODE:-native}"
      STEERING_MODE: "${MESH_STACK_SMOKE_STEERING_MODE:-approval_gate}"
      E2E_AUTO_APPROVE: "${E2E_AUTO_APPROVE:-1}"
      MESH_E2E_OPERATOR_ID: "${MESH_E2E_OPERATOR_ID:-mesh-compose-smoke}"
      MESH_E2E_OPERATOR_ROLES: "${MESH_E2E_OPERATOR_ROLES:-launcher,approver}"
      E2E_RUN_REQUEST_TIMEOUT_SECONDS: "${E2E_RUN_REQUEST_TIMEOUT_SECONDS:-90}"
      E2E_RUN_TERMINAL_WAIT_SECONDS: "${E2E_RUN_TERMINAL_WAIT_SECONDS:-600}"
      E2E_RUN_PROGRESS_GRACE_SECONDS: "${E2E_RUN_PROGRESS_GRACE_SECONDS:-120}"
      E2E_RUN_STAGE_GRACE_SECONDS: "${E2E_RUN_STAGE_GRACE_SECONDS:-600}"
      E2E_RUN_MAX_WAIT_SECONDS: "${E2E_RUN_MAX_WAIT_SECONDS:-1800}"
      E2E_ACCEPT_AWAITING_OPERATOR: "${E2E_ACCEPT_AWAITING_OPERATOR:-0}"
      MESH_AGENT_FABRIC_MODE: "${MESH_STACK_AGENT_FABRIC_MODE:-deepagents}"
      MESH_EXPECT_LATENTMAS: "${MESH_STACK_ENABLE_LATENTMAS:-1}"
      MESH_EXPECT_MESH_EVAL_TOKENIZER_PROBE: "${MESH_EXPECT_MESH_EVAL_TOKENIZER_PROBE:-1}"
      MESH_STACK_RPC_GATEWAY_URL: "http://rpc-gateway:8080/health"
      MESH_STACK_INDEXER_URL: "http://indexer:8080/health"
    command:
      - sh
      - -lc
      - /workspace/orbital-mesh/scripts/compose_stack_smoke.sh
    volumes:
      - ./:/workspace/orbital-mesh
      - mesh_kubeconfig:/mesh-kubeconfig:ro
    restart: "no"

  mesh-chaos:
    build:
      context: .
      args:
        MESH_BUILD_VERSION: "${MESH_BUILD_VERSION:-dev}"
        MESH_BUILD_COMMIT: "${MESH_BUILD_COMMIT:-unknown}"
        HERMES_AGENT_REF: "${HERMES_AGENT_REF:-1525624904159e7c2d6ac3feef951e27ad0d23bb}"
        UV_VERSION: "${UV_VERSION:-0.11.6}"
        GOOSE_VERSION: "${GOOSE_VERSION:-v1.30.0}"
    image: "${MESH_STACK_IMAGE:-orbital-mesh-stack:${MESH_BUILD_VERSION:-dev}}"
    container_name: orbital-mesh-chaos
    depends_on:
      mesh:
        condition: service_healthy
      mesh-kube-bootstrap:
        condition: service_completed_successfully
      mesh-kube-bootstrap-vm:
        condition: service_completed_successfully
      mesh-kube-bootstrap-baremetal:
        condition: service_completed_successfully
      mesh-smoke:
        condition: service_completed_successfully
    environment:
      PYTHONPATH: /workspace/orbital-mesh
      KUBECONFIG: /mesh-kubeconfig/kubeconfig:/mesh-kubeconfig-vm/kubeconfig:/mesh-kubeconfig-baremetal/kubeconfig
      BASE_URL: "${MESH_STACK_BASE_URL:-http://mesh:8787}"
      MESH_STACK_CHAOS_TARGETS: "${MESH_STACK_CHAOS_TARGETS:-mesh-compose:search:semantic-search:container,mesh-compose-vm:search:semantic-search:vm,mesh-compose-baremetal:search:semantic-search:baremetal}"
      MESH_STACK_CHAOS_DURATION_SECONDS: "${MESH_STACK_CHAOS_DURATION_SECONDS:-259200}"
      MESH_STACK_CHAOS_MIN_SLEEP_SECONDS: "${MESH_STACK_CHAOS_MIN_SLEEP_SECONDS:-45}"
      MESH_STACK_CHAOS_MAX_SLEEP_SECONDS: "${MESH_STACK_CHAOS_MAX_SLEEP_SECONDS:-180}"
      MESH_STACK_CHAOS_HOLD_SECONDS: "${MESH_STACK_CHAOS_HOLD_SECONDS:-30}"
      MESH_STACK_CHAOS_SEED: "${MESH_STACK_CHAOS_SEED:-20260428}"
      MESH_STACK_CHAOS_RUN_WAIT_SECONDS: "${MESH_STACK_CHAOS_RUN_WAIT_SECONDS:-600}"
      MESH_STACK_CHAOS_RUN_PROGRESS_GRACE_SECONDS: "${MESH_STACK_CHAOS_RUN_PROGRESS_GRACE_SECONDS:-120}"
      MESH_STACK_CHAOS_RUN_STAGE_GRACE_SECONDS: "${MESH_STACK_CHAOS_RUN_STAGE_GRACE_SECONDS:-600}"
      MESH_STACK_CHAOS_RUN_MAX_WAIT_SECONDS: "${MESH_STACK_CHAOS_RUN_MAX_WAIT_SECONDS:-1800}"
      MESH_STACK_CHAOS_REQUEST_TIMEOUT_SECONDS: "${MESH_STACK_CHAOS_REQUEST_TIMEOUT_SECONDS:-90}"
      MESH_STACK_CHAOS_REQUIRE_SUBSTRATE_COVERAGE: "${MESH_STACK_CHAOS_REQUIRE_SUBSTRATE_COVERAGE:-1}"
      MESH_STACK_CHAOS_REQUIRE_MULTI_FAULT_BREADTH: "${MESH_STACK_CHAOS_REQUIRE_MULTI_FAULT_BREADTH:-1}"
      MESH_STACK_CHAOS_EVALUATION_MODE: "${MESH_STACK_CHAOS_EVALUATION_MODE:-native}"
      MESH_STACK_CHAOS_ORCHESTRATION_MODE: "${MESH_STACK_CHAOS_ORCHESTRATION_MODE:-native}"
      MESH_STACK_CHAOS_STEERING_MODE: "${MESH_STACK_CHAOS_STEERING_MODE:-interruptible_auto}"
      MESH_STACK_CHAOS_OUTPUT_DIR: /workspace/orbital-mesh/.mesh-runtime-state/compose-chaos
    command:
      - python3
      - /workspace/orbital-mesh/scripts/compose_chaos_session.py
    healthcheck:
      disable: true
    volumes:
      - ./:/workspace/orbital-mesh
      - mesh_kubeconfig:/mesh-kubeconfig:ro
      - mesh_kubeconfig_vm:/mesh-kubeconfig-vm:ro
      - mesh_kubeconfig_baremetal:/mesh-kubeconfig-baremetal:ro
    restart: on-failure
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"

  mesh-halo-optimizer:
    profiles:
      - halo
    build:
      context: .
      args:
        MESH_BUILD_VERSION: "${MESH_BUILD_VERSION:-dev}"
        MESH_BUILD_COMMIT: "${MESH_BUILD_COMMIT:-unknown}"
        HERMES_AGENT_REF: "${HERMES_AGENT_REF:-1525624904159e7c2d6ac3feef951e27ad0d23bb}"
        UV_VERSION: "${UV_VERSION:-0.11.6}"
        GOOSE_VERSION: "${GOOSE_VERSION:-v1.30.0}"
    image: "${MESH_STACK_IMAGE:-orbital-mesh-stack:${MESH_BUILD_VERSION:-dev}}"
    container_name: orbital-mesh-halo-optimizer
    depends_on:
      mesh:
        condition: service_healthy
      mesh-agent-operator:
        condition: service_started
    environment:
      PYTHONPATH: /workspace/orbital-mesh
      MESH_STATE_DIRECTORY: /app/.mesh-runtime-state
      MESH_VAULT_PATH: /app/.mesh-runtime-state/vault
      MESH_RESEARCH_DIRECTORY: /app/.mesh-runtime-state/research
      MESH_INTEGRATIONS_CONFIG_PATH: /app/.mesh-runtime-state/integrations.json
      MESH_HALO_COMMAND: "${MESH_HALO_COMMAND:-halo}"
      MESH_HALO_MODEL: "${MESH_HALO_MODEL:-MiniMax-M2.7}"
      MESH_HALO_MAX_DEPTH: "${MESH_HALO_MAX_DEPTH:-1}"
      MESH_HALO_MAX_TURNS: "${MESH_HALO_MAX_TURNS:-8}"
      MESH_HALO_MAX_PARALLEL: "${MESH_HALO_MAX_PARALLEL:-2}"
      MESH_HALO_TRACE_LIMIT: "${MESH_HALO_TRACE_LIMIT:-100}"
      MESH_HALO_PROMPT: "${MESH_HALO_PROMPT:-Diagnose recurring Mesh harness failure modes across remediation, evaluation, agent-task, and verifier traces. Suggest bounded harness fixes only; do not propose direct production actuation.}"
      MESH_HALO_TRACE_PATH: "${MESH_HALO_TRACE_PATH:-/app/.mesh-runtime-state/halo/traces.jsonl}"
      MESH_HALO_REPORT_PATH: "${MESH_HALO_REPORT_PATH:-/app/.mesh-runtime-state/halo/report.md}"
      MESH_HALO_RECORD_TASK_ON_FAILURE: "${MESH_HALO_RECORD_TASK_ON_FAILURE:-0}"
      MESH_HALO_OPENAI_API_KEY: "${MESH_HALO_OPENAI_API_KEY:-}"
      MESH_HALO_OPENAI_BASE_URL: "${MESH_HALO_OPENAI_BASE_URL:-https://api.openai.com/v1}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-https://api.minimax.io/v1}"
    command:
      - sh
      - -lc
      - |
        mkdir -p "$$(dirname "$${MESH_HALO_TRACE_PATH}")" "$$(dirname "$${MESH_HALO_REPORT_PATH}")";
        export OPENAI_API_KEY="$${MESH_HALO_OPENAI_API_KEY:-$${OPENAI_API_KEY}}";
        export OPENAI_BASE_URL="$${MESH_HALO_OPENAI_BASE_URL:-https://api.openai.com/v1}";
        python3 /workspace/orbital-mesh/scripts/halo_outer_loop.py \
          --state-directory "$${MESH_STATE_DIRECTORY}" \
          --vault-path "$${MESH_VAULT_PATH}" \
          run \
          --output "$${MESH_HALO_TRACE_PATH}" \
          --report-path "$${MESH_HALO_REPORT_PATH}" \
          --halo-command "$${MESH_HALO_COMMAND}" \
          --model "$${MESH_HALO_MODEL}" \
          --max-depth "$${MESH_HALO_MAX_DEPTH}" \
          --max-turns "$${MESH_HALO_MAX_TURNS}" \
          --max-parallel "$${MESH_HALO_MAX_PARALLEL}" \
          --limit "$${MESH_HALO_TRACE_LIMIT}" \
          --prompt "$${MESH_HALO_PROMPT}";
        status="$$?";
        if [ "$${status}" = "0" ] || [ "$${MESH_HALO_RECORD_TASK_ON_FAILURE}" = "1" ]; then
          python3 /workspace/orbital-mesh/scripts/halo_outer_loop.py \
            --state-directory "$${MESH_STATE_DIRECTORY}" \
            --vault-path "$${MESH_VAULT_PATH}" \
            task \
            --trace-jsonl "$${MESH_HALO_TRACE_PATH}" \
            --report "$${MESH_HALO_REPORT_PATH}" \
            --print-json;
        fi;
        exit "$${status}"
    healthcheck:
      disable: true
    volumes:
      - ./:/workspace/orbital-mesh
      - mesh_runtime_state:/app/.mesh-runtime-state
    restart: "no"
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  latentmas:
    build:
      context: .
      dockerfile: "${MESH_LATENTMAS_DOCKERFILE:-Dockerfile.latentmas.cpu}"
    image: "${MESH_LATENTMAS_IMAGE:-orbital-mesh-latentmas:${MESH_BUILD_VERSION:-dev}}"
    container_name: orbital-mesh-latentmas
    environment:
      MESH_LATENTMAS_URL: "http://0.0.0.0:8791"
      MESH_LATENTMAS_MODEL_NAME: "${MESH_LATENTMAS_MODEL_NAME:-sshleifer/tiny-gpt2}"
      # Docker Desktop (macOS/Windows): default to Dockerfile.latentmas.cpu and cpu — no Metal inside Linux VMs.
      # Apple Silicon Metal (MPS): run `python -m services.orchestrator.latentmas_server` on the host with
      # MESH_LATENTMAS_DEVICE=mps and point Mesh at http://host.docker.internal:8791 .
      MESH_LATENTMAS_DEVICE: "${MESH_LATENTMAS_DEVICE:-cpu}"
      MESH_LATENTMAS_PROMPT_MODE: "${MESH_LATENTMAS_PROMPT_MODE:-sequential}"
      MESH_LATENTMAS_LATENT_STEPS: "${MESH_LATENTMAS_LATENT_STEPS:-10}"
      MESH_LATENTMAS_MAX_NEW_TOKENS: "${MESH_LATENTMAS_MAX_NEW_TOKENS:-1024}"
      MESH_LATENTMAS_USE_VLLM: "${MESH_LATENTMAS_USE_VLLM:-0}"
      HF_HOME: /cache/huggingface
      TRANSFORMERS_CACHE: /cache/huggingface
      HF_DATASETS_CACHE: /cache/huggingface
    volumes:
      - ./:/workspace/orbital-mesh
      - latentmas_hf_cache:/cache/huggingface
    ports:
      - "${MESH_LATENTMAS_PUBLISH_PORT:-8791}:8791"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8791/health', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  goose_config:
  hermes_home:
  k3s_server_data:
  k3s_vm_server_data:
  k3s_baremetal_server_data:
  latentmas_hf_cache:
  mesh_kubeconfig:
  mesh_kubeconfig_vm:
  mesh_kubeconfig_baremetal:
  mesh_runtime_state:
  mesh_postgres_data:
