title = "orbital-mesh gitleaks configuration"

[extend]
useDefault = true

[[allowlists]]
description = "Tracked generated local showcase and Next E2E artifacts are scanned by CI but are not source secrets."
paths = [
  '''^\.showcase-state/''',
  '''^meshapp/frontend/\.next-(showcase|e2e-[0-9]+)/''',
]

[[allowlists]]
description = "Vendored DeepAgents test fixture asserts a literal placeholder string, not a credential."
condition = "AND"
paths = ['''^deepagents/libs/evals/tests/evals/test_memory\.py$''']
regexes = ['''API_KEY=secret''']
