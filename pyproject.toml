[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "orbital-mesh"
version = "0.1.0"
description = "Bounded operator control plane and model-lifecycle mesh."
requires-python = ">=3.11"
dependencies = [
  "cryptography>=44,<51",
  "deepagents",
  "halo-engine",
  "langchain-openai>=1.1.14,<2.0.0",
  # ``pool`` extra pulls in psycopg_pool, used by
  # ``shared/mesh_runtime/postgres_state.py`` for connection pooling.
  # Without it Postgres mode falls back to per-call handshake, which
  # dominates per-op latency on TLS-terminated databases.
  "psycopg[binary,pool]>=3.2,<4",
]

[project.optional-dependencies]
# Offline observer-quality regression. ``simulation/eval_observer.py``
# uses deepeval to score the LLM observer's verdicts and reasons
# against faithfulness / hallucination / verdict-correctness metrics.
# Optional because deepeval pulls a heavy ML stack (transformers,
# sentence-transformers, etc.) that the runtime doesn't need. Install
# with ``uv sync --extra eval``.
eval = [
  "deepeval>=2.0,<5.0",
]

helix = [
  "helix-py",
]

[tool.uv.sources]
deepagents = { path = "deepagents/libs/deepagents", editable = true }

[tool.setuptools]
packages = [
  "shared",
  "shared.mesh_runtime",
  "services",
  "services.ingest",
  "services.trigger",
  "services.evidence",
  "services.investigation",
  "services.benchmark",
  "services.benchmark.harbor_agents",
  "services.signal_profiles",
  "services.decision",
  "services.evaluation",
  "services.evaluation.mesh_eval",
  "services.orchestrator",
  "services.orchestrator.service_agents",
  "services.simulation",
  "services.feedback",
  "services.actuators",
  "services.observer",
  "mesh_brain",
  "simulation",
]

[tool.ruff]
target-version = "py311"
line-length = 140
exclude = [
  ".cursor",
  ".hermes-local",
  ".mesh-runtime-state",
  "deepagents",
  "docs",
  "latent-mesh",
  "plugins",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "E402", "W291", "W293", "W292", "E741"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"scripts/*" = ["F401"]

[tool.mypy]
python_version = "3.11"
# Strict mypy is intentionally scoped to the hypothesis engine while the rest
# of the Python runtime is being typed incrementally. The release validation
# matrix documents this as a partial gate, not whole-repo proof.
files = [
  "services/decision/hypothesis_engine.py",
]
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [
  "deepagents",
  "fixtures",
  "latent-mesh",
]
