[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mesh-intelligence"
version = "0.1.0"
description = "Python multi-service closed-loop platform scaffold"
requires-python = ">=3.11"

[tool.setuptools]
packages = [
  "shared",
  "shared.mesh_runtime",
  "services",
  "services.ingest",
  "services.trigger",
  "services.decision",
  "services.evaluation",
  "services.orchestrator",
  "services.feedback",
  "services.actuators",
]

[tool.ruff]
target-version = "py311"
line-length = 140
exclude = [
  ".cursor",
  ".hermes-local",
  ".mesh-runtime-state",
  "docs",
  "scaffold",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "E402", "W291", "W293", "W292", "E741"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"scripts/*" = ["F401"]
