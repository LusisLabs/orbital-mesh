[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mesh-intelligence"
version = "0.1.0"
description = "Python multi-service closed-loop platform scaffold"
requires-python = ">=3.11"
dependencies = [
  "deepagents",
  "langchain-openai>=1.0.0,<2.0.0",
  "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
# Offline observer-quality regression. ``simulation/eval_observer.py``
# uses deepeval to score the LLM observer's verdicts and reasons
# against faithfulness / hallucination / verdict-correctness metrics.
# Optional because deepeval pulls a heavy ML stack (transformers,
# sentence-transformers, etc.) that the runtime doesn't need. Install
# with ``uv sync --extra eval``.
eval = [
  "deepeval>=2.0,<4.0",
]

[tool.uv.sources]
deepagents = { path = "deepagents/libs/deepagents", editable = true }

[tool.setuptools]
packages = [
  "shared",
  "shared.mesh_runtime",
  "services",
  "services.ingest",
  "services.trigger",
  "services.evidence",
  "services.decision",
  "services.evaluation",
  "services.orchestrator",
  "services.feedback",
  "services.actuators",
  "services.observer",
  "simulation",
]

[tool.ruff]
target-version = "py311"
line-length = 140
exclude = [
  ".cursor",
  ".hermes-local",
  ".mesh-runtime-state",
  "deepagents",
  "docs",
  "latent-mesh",
  "plugins",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "E402", "W291", "W293", "W292", "E741"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"scripts/*" = ["F401"]
