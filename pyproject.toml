[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mesh-intelligence"
version = "0.1.0"
description = "Python multi-service closed-loop platform scaffold"
requires-python = ">=3.11"
dependencies = [
  "deepagents",
  "halo-engine",
  "langchain-openai>=1.0.0,<2.0.0",
  "psycopg[binary]>=3.2,<4",
]

[tool.uv.sources]
deepagents = { path = "deepagents/libs/deepagents", editable = true }

[tool.setuptools]
packages = [
  "shared",
  "shared.mesh_runtime",
  "services",
  "services.ingest",
  "services.trigger",
  "services.evidence",
  "services.decision",
  "services.evaluation",
  "services.evaluation.mesh_eval",
  "services.orchestrator",
  "services.orchestrator.service_agents",
  "services.simulation",
  "services.feedback",
  "services.actuators",
  "services.observer",
  "simulation",
]

[tool.ruff]
target-version = "py311"
line-length = 140
exclude = [
  ".cursor",
  ".hermes-local",
  ".mesh-runtime-state",
  "deepagents",
  "docs",
  "latent-mesh",
  "plugins",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "E402", "W291", "W293", "W292", "E741"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"scripts/*" = ["F401"]

[tool.mypy]
python_version = "3.11"
# Strict mypy is intentionally scoped to the hypothesis engine while the rest
# of the Python runtime is being typed incrementally. The release validation
# matrix documents this as a partial gate, not whole-repo proof.
files = [
  "services/decision/hypothesis_engine.py",
]
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [
  "deepagents",
  "fixtures",
  "latent-mesh",
]
