[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mesh-intelligence"
version = "0.1.0"
description = "Python multi-service closed-loop platform scaffold"
requires-python = ">=3.11"

[tool.setuptools]
packages = [
  "shared",
  "shared.mesh_runtime",
  "services",
  "services.ingest",
  "services.trigger",
  "services.decision",
  "services.evaluation",
  "services.orchestrator",
  "services.feedback",
  "services.actuators",
]
