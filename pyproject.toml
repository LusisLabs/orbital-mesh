[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mesh-intelligence"
version = "0.1.0"
description = "Python multi-service closed-loop platform scaffold"
requires-python = ">=3.11"
dependencies = [
  "deepagents",
  "langchain-openai>=1.0.0,<2.0.0",
]

[tool.uv.sources]
deepagents = { path = "deepagents/libs/deepagents", editable = true }

[tool.setuptools]
packages = [
  "shared",
  "shared.mesh_runtime",
  "services",
  "services.ingest",
  "services.trigger",
  "services.decision",
  "services.evaluation",
  "services.orchestrator",
  "services.feedback",
  "services.actuators",
]
