services:
  hermes:
    build:
      context: .
      dockerfile: Dockerfile.hermes
      args:
        HERMES_AGENT_REF: "${HERMES_AGENT_REF:-main}"
    image: "${HERMES_RUNTIME_IMAGE:-mesh-intelligence-hermes:${MESH_BUILD_VERSION:-dev}}"
    container_name: "${MESH_HERMES_CONTAINER_NAME:-mesh-intelligence-hermes-prod}"
    working_dir: /workspace/mesh-intelligence
    command:
      - sh
      - -lc
      - |
        mkdir -p "$${HERMES_HOME}/cron" "$${HERMES_HOME}/sessions" "$${HERMES_HOME}/logs" "$${HERMES_HOME}/memories" "$${HERMES_HOME}/skills";
        cat > "$${HERMES_HOME}/config.yaml" <<EOF
        model:
          default: "$${HERMES_MODEL:-MiniMax-M2.7}"
          provider: "custom"
          base_url: "$${OPENAI_BASE_URL:-https://api.minimax.io/v1}"
        terminal:
          backend: "local"
          cwd: "."
          timeout: 180
          docker_mount_cwd_to_workspace: false
          lifetime_seconds: 300
          container_cpu: 1
          container_memory: 5120
          container_disk: 51200
          container_persistent: true
        EOF
        touch "$${HERMES_HOME}/.env";
        exec sleep infinity
    environment:
      HERMES_HOME: /workspace/mesh-intelligence/.hermes-local
      HERMES_INFERENCE_PROVIDER: "${HERMES_INFERENCE_PROVIDER:-openai}"
      HERMES_MODEL: "${HERMES_MODEL:-MiniMax-M2.7}"
      LLM_MODEL: "${LLM_MODEL:-MiniMax-M2.7}"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-https://api.minimax.io/v1}"
      OPENAI_HOST: "${OPENAI_HOST:-https://api.minimax.io/v1}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:?inject OPENAI_API_KEY through your platform secret store}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      ANTHROPIC_BASE_URL: "${ANTHROPIC_BASE_URL:-}"
      ANTHROPIC_HOST: "${ANTHROPIC_HOST:-}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      GOOGLE_API_KEY: "${GOOGLE_API_KEY:-}"
    volumes:
      - hermes_home:/workspace/mesh-intelligence/.hermes-local
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /run
      - /root/.cache
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "/opt/venv/bin/hermes", "version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  mesh:
    depends_on:
      hermes:
        condition: service_healthy
    environment:
      DOCKER_HOST: unix:///var/run/docker.sock
      MESH_HERMES_COMMAND: "${MESH_HERMES_COMMAND:-docker exec -w /workspace/mesh-intelligence -e HERMES_HOME=/workspace/mesh-intelligence/.hermes-local ${MESH_HERMES_CONTAINER_NAME:-mesh-intelligence-hermes-prod} /opt/venv/bin/hermes}"
      MESH_HERMES_COMMAND_TIMEOUT_SECONDS: "${MESH_HERMES_COMMAND_TIMEOUT_SECONDS:-180}"
      MESH_HERMES_RUN_TIMEOUT_SECONDS: "${MESH_HERMES_RUN_TIMEOUT_SECONDS:-180}"
    volumes:
      - "${MESH_DOCKER_SOCKET_HOST_PATH:-/var/run/docker.sock}:/var/run/docker.sock"

volumes:
  hermes_home:
