    volumes:
      - ./:/workspace/orbital-mesh:ro
      - mesh_runtime_state:/app/.mesh-runtime-state
    networks:
      - mesh_artifacts
    restart: "no"

  mesh-e2e-proof-verify:
    build: *mesh-stack-build
    image: "${MESH_STACK_IMAGE:-orbital-mesh-stack:${MESH_BUILD_VERSION:-dev}}"
    container_name: orbital-mesh-e2e-proof-verify
    working_dir: /workspace/orbital-mesh
    depends_on:
      mesh-e2e-proof-seed:
        condition: service_completed_successfully
    command:
      - sh
      - -lc
      - |
        set -eu
        base=/app/.mesh-runtime-state/e2e
        python3 scripts/verify_authenticated_ingress_deployment.py --proof "$${base}/authenticated-ingress-deployment-proof.json" --expected-environment pilot --json
        python3 scripts/verify_backup_restore_rehearsal.py --proof "$${base}/backup-restore-rehearsal.json" --expected-environment pilot --expected-state-backend postgres --json
        python3 scripts/verify_design_partner_packet.py --packet "$${base}/design-partner-packet.json" --json
        python3 scripts/verify_migration_rehearsal.py --proof "$${base}/migration-rehearsal.json" --json
        python3 scripts/verify_on_call_drill.py --proof "$${base}/on-call-drill.json" --expected-environment pilot --json
        python3 scripts/verify_load_concurrency_rehearsal.py --proof "$${base}/load-concurrency-rehearsal.json" --json
        python3 scripts/verify_orchestration_topology_drill.py --proof "$${base}/orchestration-topology-drill.json" --json
        python3 scripts/verify_provider_adapter_proof.py --proof "$${base}/feature-flag-provider-proof.json" --adapter-id feature_flag_provider --json
        python3 scripts/verify_provider_adapter_proof.py --proof "$${base}/incident-provider-proof.json" --adapter-id incident_provider --json
        python3 scripts/verify_audit_sink_contract.py --proof "$${base}/audit-sink-proof.json" --json
        python3 scripts/verify_audit_sink_certification.py --certification "$${base}/audit-sink-certification.json" --proof "$${base}/audit-sink-proof.json" --registry "$${base}/audit-sink-certification.registry.json" --json
        python3 scripts/verify_mesh_brain_artifact_registry.py --artifacts-json "$${base}/mesh-brain-artifacts.json" --proof-manifest "$${base}/mesh-brain-artifact-upload-proof.json" --require-upload-proof --json
        python3 scripts/verify_release_runtime_binding.py --release-provenance "$${base}/release-provenance.json" --runtime-release-provenance-path "$${base}/release-provenance.json" --json
    volumes:
      - ./:/workspace/orbital-mesh:ro
      - mesh_runtime_state:/app/.mesh-runtime-state
    networks:
      - mesh_artifacts
    restart: "no"

  mesh:
    ports: !reset []
    expose:
      - "8787"
    depends_on:
      mesh-e2e-proof-verify:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      mesh-brain-serving:
        condition: service_healthy
      feature-flag-provider:
        condition: service_healthy
      incident-provider:
        condition: service_healthy
      audit-sink:
        condition: service_healthy
      prometheus:
        condition: service_healthy
    environment:
      MESH_ENVIRONMENT: "${MESH_E2E_ENVIRONMENT:-pilot}"
      MESH_READINESS_PROFILE: "${MESH_E2E_READINESS_PROFILE:-pilot}"
      MESH_STATE_BACKEND: "postgres"
      MESH_DATABASE_URL: "postgresql://mesh:mesh@postgres:5432/mesh"
      MESH_DEFAULT_STEERING_MODE: "approval_gate"
      MESH_OPERATOR_IDENTITY_REQUIRED: "1"
      MESH_OPERATOR_HEADER: "X-Mesh-Operator"
      MESH_OPERATOR_ROLES_HEADER: "X-Mesh-Roles"
      MESH_AUTHENTICATED_INGRESS_PROOF_PATH: "/app/.mesh-runtime-state/e2e/authenticated-ingress-deployment-proof.json"
      MESH_LIVE_FEEDBACK_REQUIRED: "1"
      MESH_FEEDBACK_PROMETHEUS_ENABLED: "1"
      MESH_PROMETHEUS_URL: "http://prometheus:9090"
      MESH_OTEL_RECEIVER_ENABLED: "1"
      MESH_OTEL_RECEIVER_TOKEN: "${MESH_E2E_OTEL_TOKEN:-mesh-e2e-otel-token}"
      MESH_BRAIN_ARTIFACT_URI_PREFIX: "s3://mesh-e2e/mesh-brain"
      MESH_BRAIN_ARTIFACT_REGISTRY_PATH: "/app/.mesh-runtime-state/e2e/mesh-brain-artifacts.json"
      MESH_BRAIN_ARTIFACT_UPLOAD_PROOF_PATH: "/app/.mesh-runtime-state/e2e/mesh-brain-artifact-upload-proof.json"
      MESH_BRAIN_SERVING_BASE_URL: "http://mesh-brain-serving:8000"
      MESH_BRAIN_SERVING_MODEL: "mesh-brain-e2e-local"
      MESH_RUN_EXPORT_RETENTION_REVIEWED: "1"
      MESH_DESIGN_PARTNER_PACKET_PATH: "/app/.mesh-runtime-state/e2e/design-partner-packet.json"
      MESH_FEATURE_FLAG_CREDENTIALS_AVAILABLE: "true"
      MESH_FEATURE_FLAG_PROVIDER_PROOF_PATH: "/app/.mesh-runtime-state/e2e/feature-flag-provider-proof.json"
      MESH_INCIDENT_CREDENTIALS_AVAILABLE: "true"
      MESH_INCIDENT_PROVIDER_PROOF_PATH: "/app/.mesh-runtime-state/e2e/incident-provider-proof.json"
      MESH_AUDIT_LOGGING_AVAILABLE: "true"
      MESH_AUDIT_SINK_PROOF_PATH: "/app/.mesh-runtime-state/e2e/audit-sink-proof.json"
      MESH_AUDIT_SINK_CERTIFICATION_PATH: "/app/.mesh-runtime-state/e2e/audit-sink-certification.json"
      MESH_BACKUP_RESTORE_REHEARSAL_PATH: "/app/.mesh-runtime-state/e2e/backup-restore-rehearsal.json"
      MESH_LOAD_CONCURRENCY_REHEARSAL_PATH: "/app/.mesh-runtime-state/e2e/load-concurrency-rehearsal.json"
      MESH_ORCHESTRATION_TOPOLOGY_DRILL_PATH: "/app/.mesh-runtime-state/e2e/orchestration-topology-drill.json"
      MESH_MIGRATION_REHEARSAL_PATH: "/app/.mesh-runtime-state/e2e/migration-rehearsal.json"
      MESH_ON_CALL_DRILL_PATH: "/app/.mesh-runtime-state/e2e/on-call-drill.json"
      MESH_RELEASE_PROVENANCE_PATH: "/app/.mesh-runtime-state/e2e/release-provenance.json"
      MESH_BUILD_COMMIT: "${MESH_E2E_BUILD_COMMIT:-0123456789abcdef0123456789abcdef01234567}"
      MESH_BUILD_IMAGE_DIGEST: "${MESH_E2E_IMAGE_DIGEST:-sha256:eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee}"
      MESH_POLICY_SIGNING_KEY: "${MESH_E2E_POLICY_SIGNING_KEY:-mesh-e2e-policy-signing-key}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
    networks:
      - mesh_internal
      - mesh_data
      - mesh_targets
      - mesh_telemetry
      - mesh_artifacts
      - mesh_providers

  mesh-auth-gateway:
    image: "${MESH_E2E_CADDY_IMAGE:-caddy:2.8.4-alpine}"
    container_name: orbital-mesh-e2e-auth-gateway
    depends_on:
      mesh:
        condition: service_healthy
    environment:
      MESH_E2E_OPERATOR_ID: "${MESH_E2E_OPERATOR_ID:-mesh-e2e-operator@example.internal}"
      MESH_E2E_OPERATOR_ROLES: "${MESH_E2E_OPERATOR_ROLES:-viewer,launcher,approver,admin}"
    configs:
      - source: mesh_e2e_caddyfile
        target: /etc/caddy/Caddyfile
    ports:
      - "${MESH_E2E_INGRESS_PORT:-8443}:8443"
    networks:
      - mesh_ingress
      - mesh_internal
    restart: unless-stopped

  meshapp-frontend:
    build: *mesh-stack-build
    image: "${MESH_STACK_IMAGE:-orbital-mesh-stack:${MESH_BUILD_VERSION:-dev}}"
    container_name: orbital-mesh-e2e-meshapp-frontend
    command:
      - python3
      - -m
      - http.server
      - "3000"
      - "--bind"
      - "0.0.0.0"
      - "--directory"
      - "/app/meshapp/frontend/out"
    depends_on:
      mesh:
        condition: service_healthy
    ports:
      - "${MESH_E2E_FRONTEND_PORT:-3000}:3000"
    networks:
      - mesh_ingress
    restart: unless-stopped

  mesh-agent-operator:
    networks:
      - mesh_internal

  mesh-smoke:
    networks:
      - mesh_internal
      - mesh_targets

  mesh-chaos:
    networks:
      - mesh_internal
      - mesh_targets

  mesh-halo-optimizer:
    networks:
      - mesh_internal

  hermes:
    networks:
      - mesh_internal

  mesh-kube-bootstrap:
    networks:
      - mesh_targets

  mesh-kube-bootstrap-vm:
    networks:
      - mesh_targets

  mesh-kube-bootstrap-baremetal:
    networks:
      - mesh_targets

  latentmas:
    ports: !reset []
    expose:
      - "8791"
    networks:
      - mesh_internal

  mesh-e2e-ingress-smoke:
    build: *mesh-stack-build
    image: "${MESH_STACK_IMAGE:-orbital-mesh-stack:${MESH_BUILD_VERSION:-dev}}"
    container_name: orbital-mesh-e2e-ingress-smoke
    depends_on:
      mesh-auth-gateway:
        condition: service_started
    command:
      - python3
      - -c
      - |
        import json
        import ssl
        import urllib.request
        ctx = ssl._create_unverified_context()
        req = urllib.request.Request(
            "https://mesh-auth-gateway:8443/api/health",
            headers={"X-Mesh-Operator": "forged@example.invalid", "X-Mesh-Roles": "admin"},
        )
        with urllib.request.urlopen(req, timeout=10, context=ctx) as response:
            payload = json.loads(response.read().decode("utf-8"))
        assert payload.get("status") in {"ok", "ready"}
        print(json.dumps({"status": "pass", "target": "mesh-auth-gateway", "health": payload}, indent=2, sort_keys=True))
    networks:
      - mesh_ingress
    restart: "no"

networks:
  mesh_ingress:
    name: orbital-mesh-e2e-ingress
  mesh_internal:
    name: orbital-mesh-e2e-internal
    internal: true
  mesh_data:
    name: orbital-mesh-e2e-data
    internal: true
  mesh_targets:
    name: orbital-mesh-e2e-targets
  mesh_telemetry:
    name: orbital-mesh-e2e-telemetry
    internal: true
  mesh_artifacts:
    name: orbital-mesh-e2e-artifacts
    internal: true
  mesh_providers:
    name: orbital-mesh-e2e-providers
    internal: true

volumes:
  mesh_e2e_audit_sink_data:
  mesh_e2e_grafana_data:
  mesh_e2e_loki_data:
  mesh_e2e_minio_data:
  mesh_e2e_prometheus_data:

configs:
  mesh_e2e_caddyfile:
    content: |
      {
        admin off
      }

      https://:8443 {
        tls internal
        header {
          Strict-Transport-Security "max-age=31536000; includeSubDomains"
          X-Content-Type-Options "nosniff"
        }
        reverse_proxy mesh:8787 {
          header_up -X-Mesh-Operator
          header_up -X-Mesh-Roles
          header_up -X-Mesh-Role
          header_up X-Mesh-Operator "${MESH_E2E_OPERATOR_ID:-mesh-e2e-operator@example.internal}"
          header_up X-Mesh-Roles "${MESH_E2E_OPERATOR_ROLES:-viewer,launcher,approver,admin}"
          header_up X-Forwarded-User "${MESH_E2E_OPERATOR_ID:-mesh-e2e-operator@example.internal}"
          header_up X-Auth-Request-Email "${MESH_E2E_OPERATOR_ID:-mesh-e2e-operator@example.internal}"
          header_up X-Auth-Request-Groups "mesh-viewers,mesh-launchers,mesh-approvers,mesh-admins"
        }
      }

  mesh_e2e_prometheus:
    content: |
      global:
        scrape_interval: 10s
        evaluation_interval: 10s
      alerting:
        alertmanagers:
          - static_configs:
              - targets: ["alertmanager:9093"]
      rule_files: []
      scrape_configs:
        - job_name: mesh-control-plane
          metrics_path: /metrics
          static_configs:
            - targets: ["mesh:8787"]
        - job_name: otel-collector
          static_configs:
            - targets: ["otel-collector:8889"]
        - job_name: rpc-gateway
          metrics_path: /metrics
          static_configs:
            - targets: ["rpc-gateway:8080"]
        - job_name: indexer
          metrics_path: /metrics
          static_configs:
            - targets: ["indexer:8080"]
        - job_name: mesh-brain-serving
          metrics_path: /metrics
          static_configs:
            - targets: ["mesh-brain-serving:8000"]
        - job_name: providers
          metrics_path: /metrics
          static_configs:
            - targets:
                - "feature-flag-provider:8080"
                - "incident-provider:8080"
                - "audit-sink:8080"

  mesh_e2e_alertmanager:
    content: |
      route:
        receiver: mesh-e2e-null
      receivers:
        - name: mesh-e2e-null

  mesh_e2e_otel_collector:
    content: |
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318
      exporters:
        prometheus:
          endpoint: 0.0.0.0:8889
        otlp/jaeger:
          endpoint: jaeger:4317
          tls:
            insecure: true
      service:
        pipelines:
          metrics:
            receivers: [otlp]
            exporters: [prometheus]
          traces:
            receivers: [otlp]
            exporters: [otlp/jaeger]

  mesh_e2e_loki:
    content: |
      auth_enabled: false
      server:
        http_listen_port: 3100
      common:
        path_prefix: /loki
        storage:
          filesystem:
            chunks_directory: /loki/chunks
            rules_directory: /loki/rules
        replication_factor: 1
        ring:
          kvstore:
            store: inmemory
      schema_config:
        configs:
          - from: 2024-01-01
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: index_
              period: 24h
      limits_config:
        allow_structured_metadata: false

  mesh_e2e_grafana_datasources:
    content: |
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          access: proxy
          url: http://prometheus:9090
          isDefault: true
        - name: Loki
          type: loki
          access: proxy
          url: http://loki:3100
        - name: Jaeger
          type: jaeger
          access: proxy
          url: http://jaeger:16686
