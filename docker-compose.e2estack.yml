# E2E full-stack overlay for docker-compose.stack.yml.
#
# State slices touched:
# - Compose topology: ingress, data, target, telemetry, artifact, provider, and frontend networks.
# - Runtime evidence inputs: MESH_*_PROOF_PATH, MESH_*_REHEARSAL_PATH, release binding, and Mesh Brain artifact paths.
# - Local E2E backing services: authenticated header gateway, observability, artifact store, provider adapters, audit sink, RPC/indexer emulators, and standalone meshapp asset server.
#
# Use with:
#   docker compose -f docker-compose.stack.yml -f docker-compose.e2estack.yml config --quiet
#   docker compose -f docker-compose.stack.yml -f docker-compose.e2estack.yml up --build
#
# This is a local pilot-like E2E rehearsal stack. It wires every gate through services and verifier-shaped packets,
# but it is not a substitute for operator-captured production ingress, audit, provider, on-call, backup, load, or release evidence.

x-mesh-stack-build: &mesh-stack-build
  context: .
  args:
    MESH_BUILD_VERSION: "${MESH_BUILD_VERSION:-dev}"
    MESH_BUILD_COMMIT: "${MESH_E2E_BUILD_COMMIT:-0123456789abcdef0123456789abcdef01234567}"
    HERMES_AGENT_REF: "${HERMES_AGENT_REF:-1525624904159e7c2d6ac3feef951e27ad0d23bb}"
    UV_VERSION: "${UV_VERSION:-0.11.6}"
    GOOSE_VERSION: "${GOOSE_VERSION:-v1.30.0}"

services:
  k3s:
    ports: !reset []
    expose:
      - "6443"
    networks:
      - mesh_targets

  k3s-vm:
    networks:
      - mesh_targets

  k3s-baremetal:
    networks:
      - mesh_targets

  postgres:
    ports: !reset []
    expose:
      - "5432"
    networks:
      - mesh_data

  rpc-gateway:
    image: "${MESH_E2E_PYTHON_IMAGE:-python:3.13-alpine}"
    command:
      - python
      - -c
      - |
        import json
        from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

        class Handler(BaseHTTPRequestHandler):
            def _json(self, payload, status=200):
                body = json.dumps(payload, separators=(",", ":")).encode()
                self.send_response(status)
                self.send_header("Content-Type", "application/json")
                self.send_header("Content-Length", str(len(body)))
                self.end_headers()
                self.wfile.write(body)

            def do_GET(self):
                if self.path == "/health":
                    self._json({
                        "status": "ok",
                        "component_kind": "rpc_gateway",
                        "service": "compose-rpc-gateway",
                        "chain_id": "mesh-e2e",
                        "head_slot": 123456,
                        "finalized_slot": 123450,
                        "baseline_value": 1.0,
                        "observed_value": 2.5,
                        "delta_pct": 0.0,
                        "threshold_pct": 30.0,
                    })
                    return
                if self.path == "/metrics":
                    body = b"mesh_rpc_gateway_up 1\nmesh_rpc_gateway_head_slot 123456\n"
                    self.send_response(200)
                    self.send_header("Content-Type", "text/plain; version=0.0.4")
                    self.send_header("Content-Length", str(len(body)))
                    self.end_headers()
                    self.wfile.write(body)
                    return
                self._json({"error": "not_found"}, 404)

            def do_POST(self):
                if self.path in {"/", "/rpc"}:
                    self._json({"jsonrpc": "2.0", "id": 1, "result": "0x1e240"})
                    return
                self._json({"error": "not_found"}, 404)

        ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - mesh_targets
      - mesh_telemetry
    restart: unless-stopped

  indexer:
    image: "${MESH_E2E_PYTHON_IMAGE:-python:3.13-alpine}"
    command:
      - python
      - -c
      - |
        import json
        from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

        class Handler(BaseHTTPRequestHandler):
            def _json(self, payload, status=200):
                body = json.dumps(payload, separators=(",", ":")).encode()
                self.send_response(status)
                self.send_header("Content-Type", "application/json")
                self.send_header("Content-Length", str(len(body)))
                self.end_headers()
                self.wfile.write(body)

            def do_GET(self):
                if self.path == "/health":
                    self._json({
                        "status": "ok",
                        "component_kind": "indexer",
                        "service": "compose-indexer",
                        "chain_id": "mesh-e2e",
                        "indexed_slot": 123450,
                        "head_slot": 123456,
                        "lag_blocks": 6,
                        "baseline_value": 12.0,
                        "observed_value": 6.0,
                        "delta_pct": -50.0,
                        "threshold_pct": 30.0,
                    })
                    return
                if self.path == "/metrics":
                    body = b"mesh_indexer_up 1\nmesh_indexer_lag_blocks 6\n"
                    self.send_response(200)
                    self.send_header("Content-Type", "text/plain; version=0.0.4")
                    self.send_header("Content-Length", str(len(body)))
                    self.end_headers()
                    self.wfile.write(body)
                    return
                if self.path == "/indexed-ranges":
                    self._json({"ranges": [{"from": 120000, "to": 123450}], "status": "ok"})
                    return
                self._json({"error": "not_found"}, 404)

        ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - mesh_targets
      - mesh_telemetry
    restart: unless-stopped

  minio:
    image: "${MESH_E2E_MINIO_IMAGE:-minio/minio:RELEASE.2025-04-22T22-12-26Z}"
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: "${MESH_E2E_MINIO_ROOT_USER:-meshadmin}"
      MINIO_ROOT_PASSWORD: "${MESH_E2E_MINIO_ROOT_PASSWORD:-meshadmin123}"
    volumes:
      - mesh_e2e_minio_data:/data
    expose:
      - "9000"
      - "9001"
    networks:
      - mesh_artifacts
    restart: unless-stopped

  minio-init:
    image: "${MESH_E2E_MINIO_CLIENT_IMAGE:-minio/mc:RELEASE.2025-04-16T18-13-26Z}"
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ROOT_USER: "${MESH_E2E_MINIO_ROOT_USER:-meshadmin}"
      MINIO_ROOT_PASSWORD: "${MESH_E2E_MINIO_ROOT_PASSWORD:-meshadmin123}"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        until mc alias set e2e http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do sleep 2; done
        mc mb --ignore-existing e2e/mesh-e2e
        mc anonymous set none e2e/mesh-e2e
    networks:
      - mesh_artifacts
    restart: "no"

  mesh-brain-serving:
    image: "${MESH_E2E_PYTHON_IMAGE:-python:3.13-alpine}"
    command:
      - python
      - -c
      - |
        import json
        import time
        from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

        class Handler(BaseHTTPRequestHandler):
            def _json(self, payload, status=200):
                body = json.dumps(payload, separators=(",", ":")).encode()
                self.send_response(status)
                self.send_header("Content-Type", "application/json")
                self.send_header("Content-Length", str(len(body)))
                self.end_headers()
                self.wfile.write(body)

            def do_GET(self):
                if self.path in {"/health", "/v1/health"}:
                    self._json({"status": "ok", "model": "mesh-brain-e2e-local", "artifact_prefix": "s3://mesh-e2e/mesh-brain"})
                    return
                if self.path == "/metrics":
                    body = b"mesh_brain_serving_up 1\nmesh_brain_serving_requests_total 1\n"
                    self.send_response(200)
                    self.send_header("Content-Type", "text/plain; version=0.0.4")
                    self.send_header("Content-Length", str(len(body)))
                    self.end_headers()
                    self.wfile.write(body)
                    return
                self._json({"error": "not_found"}, 404)

            def do_POST(self):
                if self.path == "/v1/chat/completions":
                    self._json({
                        "id": "chatcmpl-mesh-e2e",
                        "object": "chat.completion",
                        "created": int(time.time()),
                        "model": "mesh-brain-e2e-local",
                        "choices": [{
                            "index": 0,
                            "message": {
                                "role": "assistant",
                                "content": "Observed evidence is verified. Bounded remediation stays reversible and safe with a rollback limit. Operator approval and human review gate any production action.",
                            },
                            "finish_reason": "stop",
                        }],
                    })
                    return
                self._json({"error": "not_found"}, 404)

        ThreadingHTTPServer(("0.0.0.0", 8000), Handler).serve_forever()
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s
    networks:
      - mesh_artifacts
      - mesh_telemetry
    restart: unless-stopped

  feature-flag-provider:
    image: "${MESH_E2E_PYTHON_IMAGE:-python:3.13-alpine}"
    command:
      - python
      - -c
      - |
        import json
        from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

        FLAGS = {"mesh-e2e-rollout": {"enabled": True, "rollout": 50}}

        class Handler(BaseHTTPRequestHandler):
            def _json(self, payload, status=200):
                body = json.dumps(payload, separators=(",", ":")).encode()
                self.send_response(status)
                self.send_header("Content-Type", "application/json")
                self.send_header("Content-Length", str(len(body)))
                self.end_headers()
                self.wfile.write(body)

            def do_GET(self):
                if self.path == "/health":
                    self._json({"status": "ok", "provider": "feature_flag_provider"})
                    return
                if self.path == "/metrics":
                    body = b"mesh_feature_flag_provider_up 1\n"
                    self.send_response(200)
                    self.send_header("Content-Type", "text/plain; version=0.0.4")
                    self.send_header("Content-Length", str(len(body)))
                    self.end_headers()
                    self.wfile.write(body)
                    return
                if self.path.startswith("/flags/"):
                    key = self.path.rsplit("/", 1)[-1]
                    self._json({"key": key, "flag": FLAGS.get(key), "status": "ok"})
                    return
                self._json({"error": "not_found"}, 404)

            def do_POST(self):
                self._json({"status": "accepted", "rollback_ref": "rollback://feature-flag/e2e"})

        ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - mesh_providers
      - mesh_telemetry
    restart: unless-stopped

  incident-provider:
    image: "${MESH_E2E_PYTHON_IMAGE:-python:3.13-alpine}"
    command:
      - python
      - -c
      - |
        import json
        from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

        class Handler(BaseHTTPRequestHandler):
            def _json(self, payload, status=200):
                body = json.dumps(payload, separators=(",", ":")).encode()
                self.send_response(status)
                self.send_header("Content-Type", "application/json")
                self.send_header("Content-Length", str(len(body)))
                self.end_headers()
                self.wfile.write(body)

            def do_GET(self):
                if self.path == "/health":
                    self._json({"status": "ok", "provider": "incident_provider"})
                    return
                if self.path == "/metrics":
                    body = b"mesh_incident_provider_up 1\nmesh_incident_provider_open_incidents 1\n"
                    self.send_response(200)
                    self.send_header("Content-Type", "text/plain; version=0.0.4")
                    self.send_header("Content-Length", str(len(body)))
                    self.end_headers()
                    self.wfile.write(body)
                    return
                if self.path == "/incidents":
                    self._json({"incidents": [{"id": "INC-E2E-1", "status": "open"}]})
                    return
                self._json({"error": "not_found"}, 404)

            def do_POST(self):
                self._json({"status": "accepted", "incident_id": "INC-E2E-1"})

        ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - mesh_providers
      - mesh_telemetry
    restart: unless-stopped

  audit-sink:
    image: "${MESH_E2E_PYTHON_IMAGE:-python:3.13-alpine}"
    command:
      - python
      - -c
      - |
        import json
        from pathlib import Path
        from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

        audit_dir = Path("/audit")
        audit_dir.mkdir(parents=True, exist_ok=True)
        sequence = audit_dir / "sequence.txt"

        class Handler(BaseHTTPRequestHandler):
            def _json(self, payload, status=200):
                body = json.dumps(payload, separators=(",", ":")).encode()
                self.send_response(status)
                self.send_header("Content-Type", "application/json")
                self.send_header("Content-Length", str(len(body)))
                self.end_headers()
                self.wfile.write(body)

            def do_GET(self):
                if self.path == "/health":
                    self._json({"status": "ok", "sink": "audit_sink", "append_only": True})
                    return
                if self.path == "/metrics":
                    count = int(sequence.read_text() or "0") if sequence.exists() else 0
                    body = f"mesh_audit_sink_up 1\nmesh_audit_sink_events_total {count}\n".encode()
                    self.send_response(200)
                    self.send_header("Content-Type", "text/plain; version=0.0.4")
                    self.send_header("Content-Length", str(len(body)))
                    self.end_headers()
                    self.wfile.write(body)
                    return
                self._json({"error": "not_found"}, 404)

            def do_POST(self):
                current = int(sequence.read_text() or "0") if sequence.exists() else 0
                next_id = current + 1
                body = self.rfile.read(int(self.headers.get("Content-Length", "0") or "0"))
                (audit_dir / f"event-{next_id:06d}.json").write_bytes(body or b"{}")
                sequence.write_text(str(next_id))
                self._json({"status": "accepted", "receipt_id": f"receipt-{next_id:06d}", "sink_sequence": next_id}, 202)

        ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
    volumes:
      - mesh_e2e_audit_sink_data:/audit
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - mesh_providers
      - mesh_telemetry
    restart: unless-stopped

  otel-collector:
    image: "${MESH_E2E_OTEL_COLLECTOR_IMAGE:-otel/opentelemetry-collector-contrib:0.115.1}"
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    configs:
      - source: mesh_e2e_otel_collector
        target: /etc/otelcol-contrib/config.yaml
    expose:
      - "4317"
      - "4318"
      - "8889"
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "--version"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - mesh_telemetry
    restart: unless-stopped

  prometheus:
    image: "${MESH_E2E_PROMETHEUS_IMAGE:-prom/prometheus:v2.55.1}"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.listen-address=0.0.0.0:9090"
      - "--storage.tsdb.path=/prometheus"
    configs:
      - source: mesh_e2e_prometheus
        target: /etc/prometheus/prometheus.yml
    volumes:
      - mesh_e2e_prometheus_data:/prometheus
    expose:
      - "9090"
    healthcheck:
      test: ["CMD", "promtool", "check", "config", "/etc/prometheus/prometheus.yml"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s
    networks:
      - mesh_telemetry
      - mesh_targets
      - mesh_artifacts
      - mesh_providers
      - mesh_internal
    restart: unless-stopped

  alertmanager:
    image: "${MESH_E2E_ALERTMANAGER_IMAGE:-prom/alertmanager:v0.27.0}"
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    configs:
      - source: mesh_e2e_alertmanager
        target: /etc/alertmanager/alertmanager.yml
    expose:
      - "9093"
    networks:
      - mesh_telemetry
    restart: unless-stopped

  loki:
    image: "${MESH_E2E_LOKI_IMAGE:-grafana/loki:3.2.1}"
    command: ["-config.file=/etc/loki/local-config.yaml"]
    configs:
      - source: mesh_e2e_loki
        target: /etc/loki/local-config.yaml
    volumes:
      - mesh_e2e_loki_data:/loki
    expose:
      - "3100"
    networks:
      - mesh_telemetry
    restart: unless-stopped

  jaeger:
    image: "${MESH_E2E_JAEGER_IMAGE:-jaegertracing/all-in-one:1.62.0}"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    expose:
      - "16686"
      - "4317"
      - "4318"
    networks:
      - mesh_telemetry
    restart: unless-stopped

  grafana:
    image: "${MESH_E2E_GRAFANA_IMAGE:-grafana/grafana:11.3.0}"
    environment:
      GF_SECURITY_ADMIN_USER: "${MESH_E2E_GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${MESH_E2E_GRAFANA_ADMIN_PASSWORD:-meshadmin}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    configs:
      - source: mesh_e2e_grafana_datasources
        target: /etc/grafana/provisioning/datasources/datasources.yml
    volumes:
      - mesh_e2e_grafana_data:/var/lib/grafana
    ports:
      - "${MESH_E2E_GRAFANA_PORT:-3001}:3000"
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_started
      jaeger:
        condition: service_started
    networks:
      - mesh_telemetry
    restart: unless-stopped

  mesh-e2e-proof-seed:
    build: *mesh-stack-build
    image: "${MESH_STACK_IMAGE:-orbital-mesh-stack:${MESH_BUILD_VERSION:-dev}}"
    container_name: orbital-mesh-e2e-proof-seed
    working_dir: /workspace/orbital-mesh
    environment:
      MESH_E2E_OPERATOR_ID: "${MESH_E2E_OPERATOR_ID:-mesh-e2e-operator@example.internal}"
      MESH_E2E_BUILD_COMMIT: "${MESH_E2E_BUILD_COMMIT:-0123456789abcdef0123456789abcdef01234567}"
      MESH_E2E_IMAGE_DIGEST: "${MESH_E2E_IMAGE_DIGEST:-sha256:eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee}"
      MESH_E2E_IMAGE_TAG: "${MESH_STACK_IMAGE:-orbital-mesh-stack:${MESH_BUILD_VERSION:-dev}}"
      MESH_E2E_ENVIRONMENT: "${MESH_E2E_ENVIRONMENT:-pilot}"
    command:
      - sh
      - -lc
      - |
        python3 - <<'PY'
        import hashlib
        import json
        import os
        import sys
        import time
        from pathlib import Path

        repo = Path("/workspace/orbital-mesh")
        sys.path.insert(0, str(repo))
        out = Path("/app/.mesh-runtime-state/e2e")
        out.mkdir(parents=True, exist_ok=True)
        operator = os.getenv("MESH_E2E_OPERATOR_ID", "mesh-e2e-operator@example.internal")
        environment = os.getenv("MESH_E2E_ENVIRONMENT", "pilot")
        commit = os.getenv("MESH_E2E_BUILD_COMMIT", "0123456789abcdef0123456789abcdef01234567")
        digest = os.getenv("MESH_E2E_IMAGE_DIGEST", "sha256:" + "e" * 64)
        image_tag = os.getenv("MESH_E2E_IMAGE_TAG", "orbital-mesh-stack:dev")
        now = time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())

        def write(name, payload):
            path = out / name
            path.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
            return path

        def payload_hash(payload):
            unsigned = dict(payload)
            unsigned.pop("packet_sha256", None)
            raw = json.dumps(unsigned, sort_keys=True, separators=(",", ":"), default=str).encode("utf-8")
            return hashlib.sha256(raw).hexdigest()

        def sha_file(path):
            h = hashlib.sha256()
            h.update(path.read_bytes())
            return h.hexdigest()

        release = {
            "schema_version": "mesh.release_provenance.v1",
            "generated_at": now,
            "status": "complete",
            "missing": [],
            "checks": {
                "git_commit": True,
                "clean_git_tree": True,
                "image_tag": True,
                "image_digest": True,
                "base_image_digests": True,
                "dependency_locks": True,
                "policy_lifecycle": True,
                "connector_certification": True,
                "deployment_compatibility": True,
                "migration_rehearsal": True,
                "sbom": True,
                "vulnerability_scan": True,
                "ci_attestation": True,
            },
            "git": {"commit": commit, "branch": "e2e-local", "dirty": False},
            "image": {"tag": image_tag, "digest": digest},
            "base_images": [{"image": "mesh-e2e-local", "digest": "sha256:" + "d" * 64}],
            "dependency_locks": [{"path": "uv.lock", "sha256": "a" * 64}],
            "build_inputs": {"compose": "docker-compose.e2estack.yml"},
            "policies": {"count": 1, "hashes": [{"path": "config/policy-lifecycle.manifest.json", "sha256": "b" * 64}], "combined_sha256": "b" * 64},
            "connectors": {"certification": {"status": "complete"}},
            "deployment": {"compatibility": {"status": "complete"}},
            "migrations": {"directory": "migrations/postgres", "version": "e2e", "hashes": [], "combined_sha256": "c" * 64},
            "sbom": {"bomFormat": "CycloneDX", "image_digest": digest},
            "vulnerability_scan": {"scanner": "e2e-local", "image_digest": digest, "findings": []},
            "ci": {
                "attestation": {
                    "provider": "compose-e2e",
                    "run_id": "mesh-e2e-local",
                    "sha": commit,
                    "expected_sha": commit,
                    "sha_matches_git_commit": True,
                }
            },
            "build": {"command": "docker compose -f docker-compose.stack.yml -f docker-compose.e2estack.yml up --build"},
            "deployment_profile": {"environment": environment, "readiness_profile": "pilot"},
        }
        release["packet_sha256"] = payload_hash(release)
        release_path = write("release-provenance.json", release)

        ingress = {
            "schema_version": "mesh.authenticated_ingress_deployment_proof.v1",
