# State slice: mesh.centaur_deployment_profile.v1
# Preview overlay keeps execution gated by namespace and credential proof.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mesh-centaur-sandbox-adapter
  namespace: mesh-centaur-sandboxes
spec:
  replicas: 0
  template:
    metadata:
      labels:
        mesh.lusis.io/environment: preview
      annotations:
        mesh.lusis.io/live-execution: blocked-until-preview-credential-egress-proof
        mesh.lusis.io/promotion-gate: mesh-operator-approval-required
    spec:
      containers:
        - name: adapter
          image: ghcr.io/lusislabs/mesh-centaur-sandbox-adapter:preview
          env:
            - name: MESH_CREDENTIAL_EGRESS_PROXY_URL
              value: http://mesh-centaur-credential-egress-proxy:15001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mesh-centaur-credential-egress-proxy
  namespace: mesh-centaur-sandboxes
spec:
  replicas: 0
  template:
    metadata:
      labels:
        mesh.lusis.io/environment: preview
      annotations:
        mesh.lusis.io/live-execution: blocked-until-preview-credential-egress-proof
        mesh.lusis.io/promotion-gate: mesh-operator-approval-required
    spec:
      containers:
        - name: credential-egress-proxy
          image: ghcr.io/lusislabs/mesh-credential-egress-proxy:preview
          env:
            - name: MESH_CREDENTIAL_ALLOWED_HOSTS
              value: preview-centaur-api.lusis.internal
