# State slice: mesh.centaur_deployment_profile.v1
# Production overlay remains disabled until live proxy audit and namespace proof pass.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mesh-centaur-sandbox-adapter
  namespace: mesh-centaur-sandboxes
spec:
  replicas: 0
  template:
    metadata:
      labels:
        mesh.lusis.io/environment: prod
      annotations:
        mesh.lusis.io/live-execution: blocked-until-prod-credential-egress-proof
        mesh.lusis.io/promotion-gate: mesh-operator-approval-required
        mesh.lusis.io/cleanup-policy: release-thread-and-delete-sandbox
    spec:
      containers:
        - name: adapter
          image: ghcr.io/lusislabs/mesh-centaur-sandbox-adapter:prod
        - name: credential-egress-proxy
          env:
            - name: MESH_CREDENTIAL_ALLOWED_HOSTS
              value: centaur-api.lusis.internal
