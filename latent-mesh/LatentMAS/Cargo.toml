[package]
name = "latentmas"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Rust orchestration core for LatentMAS and Latent Briefing experiments"

[lib]
name = "latentmas"
path = "src/lib.rs"

[[bin]]
name = "latentmas"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sentencepiece = "0.13.1"
thiserror = "2.0"
tokenizers = { version = "0.22.2", default-features = false, features = ["onig"] }

[dev-dependencies]
tempfile = "3.10"
