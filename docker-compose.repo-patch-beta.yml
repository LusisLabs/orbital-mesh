services:
  mesh:
    depends_on:
      repo_patch_authority:
        condition: service_healthy
    user: "${MESH_REPO_PATCH_CLIENT_UID:?set distinct Mesh client UID}:${MESH_REPO_PATCH_CLIENT_GID:?set distinct Mesh client GID}"
    group_add:
      - "${MESH_REPO_PATCH_AUTHORITY_GID:?set authority socket group GID}"
    ports: !override []
    networks: !override
      - repo_patch_beta_control
    extra_hosts: !override []
    environment:
      HOME: /tmp/mesh-home
      MESH_ORCHESTRATION_MODE: native_hermes
      MESH_HERMES_COMMAND: ""
      MESH_GOOSE_COMMAND: ""
      MESH_EVO_COMMAND: ""
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      GOOGLE_API_KEY: ""
      OPENROUTER_API_KEY: ""
      OPENAI_BASE_URL: ""
      OPENAI_HOST: ""
      ANTHROPIC_BASE_URL: ""
      ANTHROPIC_HOST: ""
      OLLAMA_HOST: ""
      MESH_HSAI_ADMISSION_COMMAND: "/opt/hsai/bin/hsai-mesh-admission --current-policy-id ${MESH_REPO_PATCH_BETA_POLICY_ID:?set beta repo-patch policy id}"
      MESH_HSAI_ADMISSION_AUTHORITY_MODE: "rust_evidence_v2"
      MESH_HSAI_ADMISSION_EXECUTABLE_SHA256: "${MESH_HSAI_LINUX_CLI_SHA256:?set pinned Linux HSAI CLI SHA-256}"
      MESH_REPO_PATCH_AUTHORITY_SOCKET_PATH: /run/mesh-authority/repo-patch-authority.sock
      MESH_REPO_PATCH_AUTHORITY_CLIENT_PRIVATE_KEY_PATH: /run/secrets/repo-patch/orchestrator-client-private.pem
      MESH_REPO_PATCH_AUTHORITY_CLIENT_KEY_ID: "${MESH_REPO_PATCH_AUTHORITY_CLIENT_KEY_ID:-mesh-orchestrator-client}"
      MESH_REPO_PATCH_AUTHORITY_PUBLIC_KEY_PATH: /run/secrets/repo-patch/authority-public.pem
      MESH_REPO_PATCH_AUTHORITY_KEY_ID: "${MESH_REPO_PATCH_AUTHORITY_KEY_ID:-mesh-repo-patch-authority}"
    volumes:
      - type: volume
        source: mesh_repo_patch_runtime_state
        target: /app/.mesh-runtime-state
      - type: volume
        source: mesh_repo_patch_empty_workspace
        target: /workspace/orbital-mesh
        read_only: true
      - type: volume
        source: mesh_repo_patch_empty_hermes_home
        target: /workspace/orbital-mesh/.hermes-local
        read_only: true
      - type: volume
        source: mesh_repo_patch_empty_goose_config
        target: /root/.config/goose
        read_only: true
      - type: bind
        source: /dev/null
        target: /root/.kube/config
        read_only: true
      - type: volume
        source: mesh_repo_patch_authority_socket
        target: /run/mesh-authority
        read_only: true
      - type: bind
        source: "${MESH_HSAI_LINUX_CLI_HOST_PATH:?set real Linux HSAI CLI host path}"
        target: /opt/hsai/bin/hsai-mesh-admission
        read_only: true
      - type: bind
        source: "${MESH_REPO_PATCH_ORCHESTRATOR_CLIENT_PRIVATE_KEY_HOST_PATH:?set orchestrator client private-key host path}"
        target: /run/secrets/repo-patch/orchestrator-client-private.pem
        read_only: true
      - type: bind
        source: "${MESH_REPO_PATCH_AUTHORITY_PUBLIC_KEY_HOST_PATH:?set authority public-key host path}"
        target: /run/secrets/repo-patch/authority-public.pem
        read_only: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=${MESH_REPO_PATCH_CLIENT_UID:?set distinct Mesh client UID},gid=${MESH_REPO_PATCH_CLIENT_GID:?set distinct Mesh client GID},mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          pids: 128

  repo_patch_beta_ingress:
    image: "${MESH_IMAGE:-orbital-mesh:${MESH_BUILD_VERSION:-dev}}"
    init: true
    user: "65534:65534"
    depends_on:
      mesh:
        condition: service_healthy
    command: ["python3", "-m", "services.orchestrator.beta_loopback_ingress"]
    environment:
      MESH_BETA_INGRESS_HOST: "0.0.0.0"
      MESH_BETA_INGRESS_PORT: "8787"
      MESH_BETA_INGRESS_UPSTREAM_HOST: mesh
      MESH_BETA_INGRESS_UPSTREAM_PORT: "8787"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    ports:
      - "127.0.0.1:${MESH_REPO_PATCH_BETA_PUBLISH_PORT:-8787}:8787"
    networks:
      - repo_patch_beta_control
      - repo_patch_beta_ingress
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,uid=65534,gid=65534,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.25
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/api/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  repo_patch_authority:
    image: "${MESH_REPO_PATCH_AUTHORITY_IMAGE:-orbital-mesh-repo-patch-authority:${MESH_BUILD_VERSION:-dev}}"
    build:
      context: .
      dockerfile: docker/repo-patch-authority.Dockerfile
      args:
        REPO_PATCH_PYTHON_BASE: "${MESH_REPO_PATCH_PYTHON_BASE:-python:3.13.14-alpine3.24}"
    init: true
    depends_on:
      repo_patch_verifier:
        condition: service_healthy
    user: "${MESH_REPO_PATCH_AUTHORITY_UID:?set distinct authority UID}:${MESH_REPO_PATCH_AUTHORITY_GID:?set distinct authority GID}"
    network_mode: none
    environment:
      HOME: /var/lib/mesh-authority
      MESH_STATE_BACKEND: file
      MESH_STATE_DIRECTORY: /var/lib/mesh-authority
      MESH_REPO_PATCH_AUTHORITY_STORE_BACKEND: file
      MESH_REPO_PATCH_AUTHORITY_STATE_DIRECTORY: /var/lib/mesh-authority
      MESH_REPO_PATCH_AUTHORITY_SOCKET_PATH: /run/mesh-authority/repo-patch-authority.sock
      MESH_REPO_PATCH_AUTHORITY_PRIVATE_KEY_PATH: /run/secrets/repo-patch/authority-private.pem
      MESH_REPO_PATCH_AUTHORITY_CLIENT_KEYS_PATH: /run/secrets/repo-patch/clients.json
      MESH_REPO_PATCH_AUTHORITY_PERMIT_KEY_PATH: /run/secrets/repo-patch/permit-hmac.key
      MESH_REPO_PATCH_AUTHORITY_PERMIT_KEY_ID: "${MESH_REPO_PATCH_AUTHORITY_PERMIT_KEY_ID:-repo-patch-permit-hmac}"
      MESH_REPO_PATCH_AUTHORITY_KEY_ID: "${MESH_REPO_PATCH_AUTHORITY_KEY_ID:-mesh-repo-patch-authority}"
      MESH_REPO_PATCH_AUTHORITY_ALLOWED_UIDS: "${MESH_REPO_PATCH_CLIENT_UID:?set Mesh client UID visible through SO_PEERCRED}"
      MESH_REPO_PATCH_AUTHORITY_SOCKET_GID: "${MESH_REPO_PATCH_AUTHORITY_GID:?set distinct authority GID}"
      MESH_REPO_PATCH_ALLOWED_TEST_COMMANDS_JSON: '[["python3","-c","pass"]]'
      MESH_REPO_PATCH_VERIFIER_SOCKET_PATH: /run/mesh-verifier/repo-patch-verifier.sock
      MESH_REPO_PATCH_VERIFIER_INPUT_ROOT: /var/lib/mesh-verifier/input
      MESH_REPO_PATCH_VERIFIER_UID: "0"
      MESH_REPO_PATCH_VERIFIER_IMAGE_DIGEST: "${MESH_REPO_PATCH_VERIFIER_IMAGE_DIGEST:?set immutable verifier image digest}"
      MESH_REPO_PATCH_VERIFIER_SANDBOX_PROFILE_DIGEST: "${MESH_REPO_PATCH_VERIFIER_SANDBOX_PROFILE_DIGEST:?set reviewed verifier sandbox profile digest}"
      MESH_REPO_PATCH_VERIFIER_PUBLIC_KEY_PATH: /run/mesh-verifier-keys/repo_patch_verifier_public_key.pem
      MESH_REPO_PATCH_VERIFIER_KEY_ID: "${MESH_REPO_PATCH_VERIFIER_KEY_ID:-mesh-repo-patch-verifier}"
      MESH_HSAI_ADMISSION_COMMAND: "/opt/hsai/bin/hsai-mesh-admission --current-policy-id ${MESH_REPO_PATCH_BETA_POLICY_ID:?set beta repo-patch policy id}"
      MESH_HSAI_ADMISSION_AUTHORITY_MODE: "rust_evidence_v2"
      MESH_HSAI_ADMISSION_EXECUTABLE_SHA256: "${MESH_HSAI_LINUX_CLI_SHA256:?set pinned Linux HSAI CLI SHA-256}"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    volumes:
      - type: volume
        source: mesh_repo_patch_authority_state
        target: /var/lib/mesh-authority
      - type: volume
        source: mesh_repo_patch_authority_socket
        target: /run/mesh-authority
      - type: volume
        source: mesh_repo_patch_verifier_socket
        target: /run/mesh-verifier
        read_only: true
      - type: volume
        source: mesh_repo_patch_verifier_handoff
        target: /var/lib/mesh-verifier/input
      - type: bind
        source: "${MESH_REPO_PATCH_TARGET_HOST_PATH:?set authority-owned beta target repository host path}"
        target: /workspace/target
      - type: bind
        source: "${MESH_HSAI_LINUX_CLI_HOST_PATH:?set real Linux HSAI CLI host path}"
        target: /opt/hsai/bin/hsai-mesh-admission
        read_only: true
      - type: bind
        source: "${MESH_REPO_PATCH_AUTHORITY_PRIVATE_KEY_HOST_PATH:?set authority private-key host path}"
        target: /run/secrets/repo-patch/authority-private.pem
        read_only: true
      - type: bind
        source: "${MESH_REPO_PATCH_AUTHORITY_CLIENT_KEYS_REGISTRY_HOST_PATH:?set authority client-key registry host path}"
        target: /run/secrets/repo-patch/clients.json
        read_only: true
      - type: bind
        source: "${MESH_REPO_PATCH_ORCHESTRATOR_CLIENT_PUBLIC_KEY_HOST_PATH:?set orchestrator client public-key host path}"
        target: /run/secrets/repo-patch/orchestrator-client-public.pem
        read_only: true
      - type: bind
        source: "${MESH_REPO_PATCH_AUTHORITY_PERMIT_KEY_HOST_PATH:?set authority permit-key host path}"
        target: /run/secrets/repo-patch/permit-hmac.key
        read_only: true
      - type: bind
        source: "${MESH_REPO_PATCH_VERIFIER_PUBLIC_KEY_HOST_PATH:?set verifier public-key host path}"
        target: /run/mesh-verifier-keys/repo_patch_verifier_public_key.pem
        read_only: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 1g
    cpus: 1.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import os,stat; assert stat.S_ISSOCK(os.stat('/run/mesh-authority/repo-patch-authority.sock').st_mode)"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  repo_patch_verifier_key_init:
    image: "${MESH_REPO_PATCH_VERIFIER_IMAGE:-orbital-mesh-repo-patch-verifier:${MESH_BUILD_VERSION:-dev}}"
    build:
      context: .
      dockerfile: docker/repo-patch-verifier.Dockerfile
      args:
        REPO_PATCH_PYTHON_BASE: "${MESH_REPO_PATCH_PYTHON_BASE:-python:3.13.14-alpine3.24}"
    user: "0:0"
    network_mode: none
    entrypoint: ["python3", "-c"]
    command:
      - |
        import os, stat
        from pathlib import Path
        source = Path('/source/repo_patch_verifier_private_key.pem')
        target = Path('/staged/repo_patch_verifier_private_key.pem')
        metadata = source.lstat()
        if source.is_symlink() or not stat.S_ISREG(metadata.st_mode) or metadata.st_size > 65536 or stat.S_IMODE(metadata.st_mode) & 0o077:
            raise SystemExit('verifier private key source rejected')
        payload = source.read_bytes()
        if not payload:
            raise SystemExit('verifier private key source is empty')
        if target.exists():
            target_metadata = target.lstat()
            if target.is_symlink() or not stat.S_ISREG(target_metadata.st_mode) or stat.S_IMODE(target_metadata.st_mode) & 0o077 or target.read_bytes() != payload:
                raise SystemExit('staged verifier private key differs; remove the key volume before rotation')
        else:
            descriptor = os.open(target, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)
            with os.fdopen(descriptor, 'wb') as handle:
                handle.write(payload)
                handle.flush()
                os.fsync(handle.fileno())
        os.chmod(target, 0o600)
    volumes:
      - type: bind
        source: "${MESH_REPO_PATCH_VERIFIER_PRIVATE_KEY_HOST_PATH:?set mode-0600 verifier private-key host path}"
        target: /source/repo_patch_verifier_private_key.pem
        read_only: true
      - type: volume
        source: mesh_repo_patch_verifier_key
        target: /staged
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 16
    mem_limit: 64m
    cpus: 0.1
    restart: "no"

  repo_patch_verifier:
    image: "${MESH_REPO_PATCH_VERIFIER_IMAGE:-orbital-mesh-repo-patch-verifier:${MESH_BUILD_VERSION:-dev}}"
    build:
      context: .
      dockerfile: docker/repo-patch-verifier.Dockerfile
      args:
        REPO_PATCH_PYTHON_BASE: "${MESH_REPO_PATCH_PYTHON_BASE:-python:3.13.14-alpine3.24}"
    init: true
    depends_on:
      repo_patch_verifier_key_init:
        condition: service_completed_successfully
    user: "0:0"
    network_mode: none
    environment:
      HOME: /var/empty
      MESH_REPO_PATCH_VERIFIER_SOCKET_PATH: /run/mesh-verifier/repo-patch-verifier.sock
      MESH_REPO_PATCH_VERIFIER_INPUT_ROOT: /var/lib/mesh-verifier/input
      MESH_REPO_PATCH_VERIFIER_SCRATCH_ROOT: /var/lib/mesh-verifier/scratch
      MESH_REPO_PATCH_VERIFIER_LEDGER_DIRECTORY: /var/lib/mesh-verifier/ledger
      MESH_REPO_PATCH_VERIFIER_ALLOWED_AUTHORITY_UIDS: "${MESH_REPO_PATCH_AUTHORITY_UID:?set distinct authority UID}"
      MESH_REPO_PATCH_VERIFIER_SOCKET_GID: "${MESH_REPO_PATCH_AUTHORITY_GID:?set authority socket group GID}"
      MESH_REPO_PATCH_VERIFIER_RUNNER_UID: "${MESH_REPO_PATCH_VERIFIER_RUNNER_UID:-6000}"
      MESH_REPO_PATCH_VERIFIER_RUNNER_GID: "${MESH_REPO_PATCH_VERIFIER_RUNNER_GID:-6000}"
      MESH_REPO_PATCH_VERIFIER_IMAGE_DIGEST: "${MESH_REPO_PATCH_VERIFIER_IMAGE_DIGEST:?set immutable verifier image digest}"
      MESH_REPO_PATCH_VERIFIER_SANDBOX_PROFILE_DIGEST: "${MESH_REPO_PATCH_VERIFIER_SANDBOX_PROFILE_DIGEST:?set reviewed verifier sandbox profile digest}"
      MESH_REPO_PATCH_VERIFIER_PRIVATE_KEY_PATH: /run/verifier-key/repo_patch_verifier_private_key.pem
      MESH_REPO_PATCH_VERIFIER_KEY_ID: "${MESH_REPO_PATCH_VERIFIER_KEY_ID:-mesh-repo-patch-verifier}"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    volumes:
      - type: volume
        source: mesh_repo_patch_verifier_socket
        target: /run/mesh-verifier
      - type: volume
        source: mesh_repo_patch_verifier_handoff
        target: /var/lib/mesh-verifier/input
        read_only: true
      - type: volume
        source: mesh_repo_patch_verifier_ledger
        target: /var/lib/mesh-verifier/ledger
      - type: volume
        source: mesh_repo_patch_verifier_key
        target: /run/verifier-key
        read_only: true
    read_only: true
    tmpfs:
      - /var/lib/mesh-verifier/scratch:rw,nosuid,nodev,size=128m,uid=0,gid=0,mode=0700
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - KILL
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.5
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import os,stat; assert stat.S_ISSOCK(os.stat('/run/mesh-verifier/repo-patch-verifier.sock').st_mode)"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

volumes:
  mesh_repo_patch_runtime_state:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: "${MESH_REPO_PATCH_MESH_STATE_HOST_PATH:?set Mesh-client-owned durable state host path}"
  mesh_repo_patch_authority_state:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: "${MESH_REPO_PATCH_AUTHORITY_STATE_HOST_PATH:?set authority-owned durable state host path}"
  mesh_repo_patch_authority_socket:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "uid=${MESH_REPO_PATCH_AUTHORITY_UID:?set distinct authority UID},gid=${MESH_REPO_PATCH_AUTHORITY_GID:?set distinct authority GID},mode=0750"
  mesh_repo_patch_verifier_socket:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "uid=0,gid=${MESH_REPO_PATCH_AUTHORITY_GID:?set distinct authority GID},mode=0750"
  mesh_repo_patch_verifier_handoff:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "uid=${MESH_REPO_PATCH_AUTHORITY_UID:?set distinct authority UID},gid=${MESH_REPO_PATCH_AUTHORITY_GID:?set distinct authority GID},mode=0700,size=128m"
  mesh_repo_patch_verifier_ledger:
  mesh_repo_patch_verifier_key:
  mesh_repo_patch_empty_workspace:
  mesh_repo_patch_empty_hermes_home:
  mesh_repo_patch_empty_goose_config:

networks:
  repo_patch_beta_control:
    internal: true
  repo_patch_beta_ingress:
